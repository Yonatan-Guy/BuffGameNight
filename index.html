<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי שלח?</title>
<meta name="description" content="Party game for your group chat: the funniest messages with the names hidden. Everyone guesses who sent it from their phone.">
<meta name="theme-color" content="#0c0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=JetBrains+Mono:wght@700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<!-- ================= Home ================= -->
<section class="screen active" id="home">
  <div class="home">

    <div class="desk" aria-hidden="true">
      <span class="dicon"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="1" y="4" width="14" height="10" fill="#000"/><rect x="2" y="5" width="12" height="8" fill="#ffe14d"/><rect x="1" y="2" width="6" height="3" fill="#000"/><rect x="2" y="3" width="4" height="2" fill="#ffe14d"/></svg><i>חחחח</i></span>
      <span class="dicon"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="1" width="10" height="14" fill="#000"/><rect x="4" y="2" width="8" height="12" fill="#fff"/><rect x="5" y="4" width="6" height="1" fill="#0a1a8c"/><rect x="5" y="6" width="6" height="1" fill="#0a1a8c"/><rect x="5" y="8" width="4" height="1" fill="#0a1a8c"/></svg><i>_chat.txt</i></span>
      <span class="dicon"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="7" y="1" width="2" height="1" fill="#000"/><rect x="6" y="2" width="4" height="2" fill="#000"/><rect x="5" y="4" width="6" height="2" fill="#000"/><rect x="4" y="6" width="8" height="2" fill="#000"/><rect x="3" y="8" width="10" height="2" fill="#000"/><rect x="2" y="10" width="12" height="2" fill="#000"/><rect x="1" y="12" width="14" height="2" fill="#000"/><rect x="7" y="3" width="2" height="1" fill="#ffe14d"/><rect x="6" y="4" width="4" height="3" fill="#ffe14d"/><rect x="5" y="7" width="6" height="2" fill="#ffe14d"/><rect x="4" y="9" width="8" height="2" fill="#ffe14d"/><rect x="3" y="11" width="10" height="2" fill="#ffe14d"/><rect x="7" y="6" width="2" height="4" fill="#000"/><rect x="7" y="11" width="2" height="1" fill="#000"/></svg><i>roast.exe</i></span>
    </div>
    <h1 class="logo" id="logo"><span data-t="logoA">מי </span><span class="redact"><span data-t="logoB">שלח</span><i class="bar"></i></span><span data-t="logoC">?</span></h1>
    <p class="tagline" data-t="tagline"></p>
    <div class="tiles">
      <button class="tile primary wnd" data-title="host.exe" onclick="goSetup()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="ln" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg><svg class="px" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="2" width="14" height="10" fill="#000"/><rect x="2" y="3" width="12" height="8" fill="#c6c6c6"/><rect x="3" y="4" width="10" height="6" fill="#0a1a8c"/><rect x="4" y="5" width="3" height="2" fill="#2f6fd6"/><rect x="5" y="12" width="6" height="1" fill="#000"/><rect x="3" y="13" width="10" height="2" fill="#000"/><rect x="4" y="13" width="8" height="1" fill="#c6c6c6"/></svg>
        <span class="tt"><b data-t="hostTitle"></b><span data-t="hostSub"></span></span>
      </button>
      <button class="tile wnd" data-title="join.exe" onclick="show('join')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="ln" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg><svg class="px" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="8" height="14" fill="#000"/><rect x="5" y="2" width="6" height="10" fill="#18a3a3"/><rect x="6" y="3" width="2" height="1" fill="#fff"/><rect x="7" y="13" width="2" height="1" fill="#c6c6c6"/></svg>
        <span class="tt"><b data-t="joinTitle"></b><span data-t="joinSub"></span></span>
      </button>
    </div>
    <div id="rejoinBox" hidden><button class="btn" id="rejoinBtn" onclick="rejoin()"></button></div>
    <a class="guideLink" href="guide.html" data-t="howTo"></a>
  </div>
</section>

<!-- ================= TV: choose a game ================= -->
<section class="screen" id="setup">
  <div class="wrap">
    <div class="topbar">
      <button class="btn ghost small back" onclick="history.back()" data-t="back"></button>
      <h2 data-t="setupTitle"></h2>
    </div>
    <label class="drop wnd" data-title="open_game.exe" id="drop" for="fileInput">
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <input type="file" id="picInput" accept="image/*" hidden>
      <strong data-t="dropTitle"></strong>
      <span class="muted" data-t="dropSub"></span>
    </label>
    <div id="loadMsg" class="msg" role="status" aria-live="polite"></div>
    <div id="gamesList" class="games"></div>
    <div class="setupFoot small">
      <a href="guide.html" data-t="noFile"></a>
      <button class="linkbtn" onclick="loadSample()" data-t="trySample"></button>
      <span class="muted" data-t="privacy"></span>
    </div>
  </div>
</section>

<!-- ================= TV: lobby ================= -->
<section class="screen" id="lobby">
  <div class="wrap wide">
    <div class="topbar">
      <button class="btn ghost small back" onclick="history.back()" data-t="back"></button>
      <span class="muted" id="lobbyTitle" dir="auto"></span>
    </div>
    <div class="lobbyMain">
      <div class="joinInfo wnd" data-title="join_the_room.exe">
        <span class="muted" data-t="joinAt"></span>
        <span class="joinUrl" id="joinUrl"></span>
        <span class="muted" data-t="andCode"></span>
        <span class="code" id="roomCode">····</span>
        <span class="muted small" id="hostStatus"></span>
      </div>
      <div class="qrBox wnd" data-title="scan_me.png"><div id="qr"></div><span data-t="orScan"></span></div>
    </div>
    <div id="players" class="players"></div>
    <div class="lobbyFoot">
      <span class="muted" id="count"></span>
      <button class="btn big" id="startBtn" onclick="startGame()" disabled data-primary data-t="start"></button>
    </div>
  </div>
</section>

<!-- ================= TV: game ================= -->
<section class="screen" id="game">
  <div class="timebar" id="timebar"><i id="timeFill"></i></div>
  <div class="wrap wide">
    <header class="ghead">
      <span class="brand" data-t="docTitle"></span>
      <span class="prog" id="prog"></span>
      <span class="hright"><span id="previewBar" hidden><span class="tag" data-t="previewOn"></span>
        <button class="btn ghost small" onclick="location.reload()" data-t="exitPreview"></button></span>
      <button class="btn ghost small" onclick="toggleSkin()" aria-label="Style" title="Style">◐</button>
      <button id="playersBtn" class="btn ghost small" hidden onclick="togglePlayers()" data-t="playersBtn"></button>
      <span class="timer" id="timer"></span></span>
    </header>
    <div id="stage"></div>
  </div>
</section>

<!-- ================= Phone: join ================= -->
<section class="screen" id="join">
  <div class="joinForm wnd" data-title="join.exe">
    <div><button class="btn ghost small back" onclick="history.back()" data-t="back"></button></div>
    <h2 data-t="joinHeading"></h2>
    <label for="codeInput" data-t="codePh"></label>
    <input class="txt" id="codeInput" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="1234">
    <label for="nameInput" data-t="namePh"></label>
    <input class="txt" id="nameInput" maxlength="16" autocomplete="nickname" dir="auto">
    <button class="btn big" id="joinBtn" onclick="joinRoom()" data-t="joinBtn"></button>
    <div id="status" class="msg" role="status" aria-live="polite"></div>
  </div>
</section>

<!-- ================= Phone: in game ================= -->
<section class="screen" id="player">
  <div class="pbar"><span id="pName" dir="auto"></span><span class="pprog" id="pProg"></span><span class="pr"><button class="kick" onclick="toggleSkin()" aria-label="Style" title="Style">◐</button><span class="sc" id="pScore">0</span></span></div>
  <div class="pview" id="pview"></div>
</section>

<div id="prefs"><button class="btn ghost small" id="skinBtn" onclick="toggleSkin()"></button><button class="btn ghost small" id="langBtn" onclick="toggleLang()" data-t="langSwitch">English</button></div>
<div id="playersPanel" class="wnd" data-title="players.exe" hidden></div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/game.js"></script>
</body>
</html>f
