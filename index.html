<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Party Quiz</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#1b1140; --card:#2a1d5e; --accent:#ffcc00; --text:#fff; --muted:#b9b0e0;
          --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .screen { display:none; min-height:100vh; padding:16px; text-align:center; }
  .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font-size:2.2rem; margin:0 0 20px; }
  button { font-size:1.2rem; padding:16px 28px; border:0; border-radius:12px; cursor:pointer;
           background:var(--accent); color:#1b1140; font-weight:700; margin:8px; }
  button:disabled { opacity:.4; cursor:default; }
  button.secondary { background:var(--card); color:var(--text); }
  input { font-size:1.4rem; padding:14px; border-radius:10px; border:0; width:100%;
          max-width:340px; margin:8px 0; text-align:center; }
  .muted { color:var(--muted); }

  /* ---------- TV ---------- */
  .wide { width:100%; max-width:1100px; }
  .code { font-size:6rem; font-weight:800; letter-spacing:12px; color:var(--accent); margin:8px 0; }
  .hostTop { display:flex; gap:32px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #qr { background:#fff; padding:12px; border-radius:12px; }
  #players { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:28px 0; min-height:70px; }
  .chip { background:var(--card); padding:12px 22px; border-radius:40px; font-size:1.5rem;
          font-weight:700; animation:pop .3s ease-out; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }

  .qtop { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:16px; }
  .timer { width:90px; height:90px; border-radius:50%; background:var(--card); display:flex;
           align-items:center; justify-content:center; font-size:2.4rem; font-weight:800; }
  .qtext { background:#fff; color:#222; font-size:2.4rem; font-weight:700; padding:28px;
           border-radius:14px; width:100%; margin-bottom:20px; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; }
  .ans { display:flex; align-items:center; gap:16px; padding:22px; border-radius:12px;
         font-size:1.7rem; font-weight:700; text-align:left; transition:opacity .3s; }
  .ans .shape { font-size:2rem; }
  .ans .cnt { margin-left:auto; background:rgba(0,0,0,.25); padding:4px 14px; border-radius:20px; }
  .ans.dim { opacity:.3; }
  .c0 { background:var(--red); } .c1 { background:var(--blue); }
  .c2 { background:var(--yellow); } .c3 { background:var(--green); }

  .board { width:100%; max-width:700px; margin:16px 0; }
  .row { display:flex; justify-content:space-between; background:var(--card); padding:14px 22px;
         border-radius:10px; margin:8px 0; font-size:1.5rem; font-weight:700; }
  .row .plus { color:var(--accent); font-size:1.1rem; margin-left:10px; }
  .row.gold { background:var(--accent); color:#1b1140; }
  .row.gold .plus { color:#1b1140; }

  /* ---------- Phone ---------- */
  #player { padding:0; justify-content:flex-start; }
  .pbar { width:100%; display:flex; justify-content:space-between; padding:12px 16px;
          background:var(--card); font-weight:700; }
  #pview { flex:1; width:100%; display:flex; flex-direction:column; align-items:center;
           justify-content:center; padding:16px; }
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; height:calc(100vh - 80px); }
  .pbtn { border:0; border-radius:14px; font-size:4rem; color:#fff; margin:0; padding:0; }
  .big { font-size:4rem; margin:0; }
  .result-ok { background:var(--green); } .result-bad { background:var(--red); }
  .full { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; }
</style>
</head>
<body>

<!-- ================= Home ================= -->
<div class="screen active" id="home">
  <h1>🎉 Party Quiz</h1>
  <button onclick="startHost()">📺 Host on TV</button>
  <button class="secondary" onclick="show('join')">📱 Join with phone</button>
</div>

<!-- ================= TV: lobby ================= -->
<div class="screen" id="lobby">
  <div class="wide">
    <div class="hostTop">
      <div>
        <div class="muted">Open this site on your phone and enter:</div>
        <div class="code" id="roomCode">····</div>
        <div class="muted" id="hostStatus">Creating room…</div>
      </div>
      <div id="qr"></div>
    </div>
    <div id="players"></div>
    <div class="muted" id="count">Waiting for players…</div>
    <button id="startBtn" onclick="startGame()" disabled>▶ Start game</button>
  </div>
</div>

<!-- ================= TV: game (question / reveal / final) ================= -->
<div class="screen" id="game"><div class="wide" id="gameView"></div></div>

<!-- ================= Phone: join ================= -->
<div class="screen" id="join">
  <h1>Join a room</h1>
  <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="Room code"><br>
  <input id="nameInput" maxlength="16" placeholder="Your name"><br>
  <button id="joinBtn" onclick="joinRoom()">Join</button>
  <div id="status" class="muted" style="margin-top:14px;min-height:1.4em"></div>
</div>

<!-- ================= Phone: in game ================= -->
<div class="screen" id="player">
  <div class="pbar"><span id="pName"></span><span id="pScore">0</span></div>
  <div id="pview"></div>
</div>

<script>
/* =========================================================
   EDIT YOUR QUESTIONS HERE
   correct = index of the right answer (0 = first)
   ========================================================= */
const QUESTIONS = [
  { q: "What is the capital of Australia?",      a: ["Sydney", "Canberra", "Melbourne", "Perth"], correct: 1 },
  { q: "How many bits are in a byte?",            a: ["4", "8", "16", "32"],                       correct: 1 },
  { q: "Which planet is called the Red Planet?",  a: ["Venus", "Jupiter", "Mars", "Saturn"],       correct: 2 },
  { q: "What does CPU stand for?",                a: ["Central Processing Unit", "Computer Power Unit",
                                                      "Core Process Utility", "Central Program Uploader"], correct: 0 },
  { q: "At sea level, water boils at…",           a: ["90 °C", "100 °C", "110 °C", "120 °C"],     correct: 1 },
];
const DURATION = 20;          // seconds per question
const MAX_POINTS = 1000;      // fast correct answer ≈ 1000, slow correct ≈ 500

const PREFIX = "partyquiz-demo-g7k2-";   // keeps our room IDs unique on the free PeerJS server
const SHAPES = ["▲", "◆", "●", "■"];

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   HOST (TV)
   ========================================================= */
const players = new Map();   // key (lowercase name) -> { name, conn, connected, score, answer, elapsed, lastPoints }
let phase = 'lobby';         // lobby | question | reveal | final
let qIndex = -1, qStart = 0, timerId = null;

function startHost() {
  show('lobby');
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const peer = new Peer(PREFIX + code);

  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('hostStatus').textContent = 'Room is open';
    const joinUrl = location.origin + location.pathname + '?join=' + code;
    document.getElementById('qr').innerHTML = '';
    new QRCode(document.getElementById('qr'), { text: joinUrl, width: 160, height: 160 });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); startHost(); }
    else document.getElementById('hostStatus').textContent = 'Error: ' + err.type;
  });
  peer.on('connection', handleConnection);

  // Space / Enter presses the main button on the TV
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    const btn = document.querySelector('.screen.active button:not(:disabled)');
    if (btn) { e.preventDefault(); btn.click(); }
  });
}

function handleConnection(conn) {
  conn.on('data', msg => {
    if (msg.type === 'join') {
      const name = String(msg.name || '').trim().slice(0, 16);
      const key = name.toLowerCase();
      if (!name) return;
      const existing = players.get(key);
      if (existing && existing.connected) { conn.send({ type: 'error', text: 'That name is taken' }); return; }

      // New player, or a player reconnecting with the same name (keeps their score)
      const p = existing || { name, score: 0, answer: null, elapsed: 0, lastPoints: 0 };
      p.conn = conn; p.connected = true; conn._key = key;
      players.set(key, p);
      conn.send({ type: 'welcome', name: p.name, score: p.score });
      syncPlayer(p);
      refreshHost();
    }
    else if (msg.type === 'answer') {
      const p = players.get(conn._key);
      if (p && p.conn === conn) onAnswer(p, msg.choice);
    }
  });
  conn.on('close', () => {
    const p = players.get(conn._key);
    if (!p || p.conn !== conn) return;
    p.connected = false;
    if (phase === 'lobby') players.delete(conn._key);
    refreshHost();
  });
}

// Tell a (re)joining phone what's going on right now
function syncPlayer(p) {
  if (phase === 'lobby') send(p, { type: 'wait', text: 'You\'re in! Watch the TV.' });
  else if (phase === 'question' && p.answer === null) send(p, questionMsg());
  else if (phase === 'question') send(p, { type: 'wait', text: 'Answer sent ⏳' });
  else send(p, { type: 'wait', text: 'Get ready for the next question…' });
}

function send(p, msg) { if (p.connected && p.conn.open) p.conn.send(msg); }
function broadcast(msg) { players.forEach(p => send(p, msg)); }
function connectedPlayers() { return [...players.values()].filter(p => p.connected); }

function refreshHost() {
  if (phase === 'lobby') renderLobby();
  else if (phase === 'question') updateAnsweredCount();
}

function renderLobby() {
  const box = document.getElementById('players');
  box.innerHTML = '';
  players.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = p.name;
    box.appendChild(chip);
  });
  const n = connectedPlayers().length;
  document.getElementById('count').textContent =
    n === 0 ? 'Waiting for players…' : n + (n === 1 ? ' player' : ' players') + ' connected';
  document.getElementById('startBtn').disabled = n === 0;
}

/* ---------- game flow ---------- */
function startGame() {
  players.forEach((p, key) => { if (!p.connected) players.delete(key); });
  players.forEach(p => { p.score = 0; });
  qIndex = -1;
  show('game');
  nextQuestion();
}

function questionMsg() {
  return { type: 'question', n: qIndex + 1, total: QUESTIONS.length, choices: QUESTIONS[qIndex].a.length };
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= QUESTIONS.length) { showFinal(); return; }
  phase = 'question';
  players.forEach(p => { p.answer = null; p.lastPoints = 0; });

  const q = QUESTIONS[qIndex];
  document.getElementById('gameView').innerHTML = `
    <div class="qtop">
      <div class="muted">Question ${qIndex + 1} / ${QUESTIONS.length}</div>
      <div class="timer" id="timer">${DURATION}</div>
      <div class="muted" id="answered">0 answers</div>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="answers">
      ${q.a.map((t, i) => `<div class="ans c${i}" id="ans${i}">
        <span class="shape">${SHAPES[i]}</span><span>${esc(t)}</span></div>`).join('')}
    </div>`;

  qStart = performance.now();
  broadcast(questionMsg());
  clearInterval(timerId);
  timerId = setInterval(() => {
    const left = Math.max(0, DURATION - (performance.now() - qStart) / 1000);
    const el = document.getElementById('timer');
    if (el) el.textContent = Math.ceil(left);
    if (left <= 0) endQuestion();
  }, 200);
}

function onAnswer(p, choice) {
  if (phase !== 'question' || p.answer !== null) return;
  if (!Number.isInteger(choice) || choice < 0 || choice >= QUESTIONS[qIndex].a.length) return;
  p.answer = choice;
  p.elapsed = (performance.now() - qStart) / 1000;   // measured on the TV, so phone clocks don't matter
  send(p, { type: 'wait', text: 'Answer sent ⏳' });
  updateAnsweredCount();
  const online = connectedPlayers();
  if (online.length > 0 && online.every(x => x.answer !== null)) endQuestion();
}

function updateAnsweredCount() {
  const n = [...players.values()].filter(p => p.answer !== null).length;
  const el = document.getElementById('answered');
  if (el) el.textContent = n + (n === 1 ? ' answer' : ' answers');
}

function ranking() { return [...players.values()].sort((a, b) => b.score - a.score); }

function endQuestion() {
  if (phase !== 'question') return;
  phase = 'reveal';
  clearInterval(timerId);
  const q = QUESTIONS[qIndex];

  // score
  players.forEach(p => {
    const right = p.answer === q.correct;
    p.lastPoints = right ? Math.round(MAX_POINTS * (1 - 0.5 * Math.min(1, p.elapsed / DURATION))) : 0;
    p.score += p.lastPoints;
  });
  const ranked = ranking();
  ranked.forEach((p, i) => send(p, {
    type: 'result', answered: p.answer !== null, correct: p.answer === q.correct,
    points: p.lastPoints, score: p.score, rank: i + 1, of: ranked.length
  }));

  // show correct answer + how many picked each
  q.a.forEach((_, i) => {
    const box = document.getElementById('ans' + i);
    const cnt = [...players.values()].filter(p => p.answer === i).length;
    box.insertAdjacentHTML('beforeend', `<span class="cnt">${cnt}</span>`);
    if (i !== q.correct) box.classList.add('dim'); else box.insertAdjacentHTML('afterbegin', '✔');
  });
  document.getElementById('timer').textContent = '✓';

  const last = qIndex === QUESTIONS.length - 1;
  document.getElementById('gameView').insertAdjacentHTML('beforeend', `
    <div class="board" style="margin:20px auto">
      ${ranked.slice(0, 5).map((p, i) => `<div class="row ${i === 0 ? 'gold' : ''}">
        <span>${i + 1}. ${esc(p.name)}</span>
        <span>${p.score}${p.lastPoints ? `<span class="plus">+${p.lastPoints}</span>` : ''}</span></div>`).join('')}
    </div>
    <button onclick="nextQuestion()">${last ? '🏆 Final results' : 'Next question ▶'}</button>`);
}

function showFinal() {
  phase = 'final';
  const ranked = ranking();
  const medals = ['🥇', '🥈', '🥉'];
  document.getElementById('gameView').innerHTML = `
    <h1>🏆 Final results</h1>
    <div class="board" style="margin:0 auto 20px">
      ${ranked.map((p, i) => `<div class="row ${i === 0 ? 'gold' : ''}">
        <span>${medals[i] || (i + 1) + '.'} ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}
    </div>
    <button onclick="backToLobby()">🔁 Play again</button>`;
  ranked.forEach((p, i) => send(p, { type: 'final', rank: i + 1, of: ranked.length, score: p.score }));
}

function backToLobby() {
  phase = 'lobby';
  players.forEach((p, key) => { if (!p.connected) players.delete(key); else p.score = 0; });
  broadcast({ type: 'wait', text: 'New game soon! Watch the TV.' });
  broadcast({ type: 'score', score: 0 });
  show('lobby');
  renderLobby();
}

/* =========================================================
   PLAYER (phone)
   ========================================================= */
let myConn = null;

function joinRoom() {
  const code = document.getElementById('codeInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  const status = document.getElementById('status');
  if (!/^\d{4}$/.test(code)) { status.textContent = 'Enter the 4-digit code'; return; }
  if (!name) { status.textContent = 'Enter your name'; return; }
  status.textContent = 'Connecting…';
  document.getElementById('joinBtn').disabled = true;

  const peer = new Peer();
  const fail = text => { status.textContent = text; document.getElementById('joinBtn').disabled = false; peer.destroy(); };

  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => conn.send({ type: 'join', name }));
    conn.on('data', msg => onHostMessage(msg, conn, fail));
    conn.on('close', () => { if (myConn === conn) pview(`<p class="big">📴</p><h2>Disconnected</h2>
      <button onclick="location.reload()">Rejoin</button>`); });
  });
  peer.on('error', err => fail(err.type === 'peer-unavailable' ? 'Room not found — check the code' : 'Error: ' + err.type));
}

function pview(html, cls = '') {
  const v = document.getElementById('pview');
  v.className = cls;
  v.innerHTML = html;
}

function onHostMessage(msg, conn, fail) {
  switch (msg.type) {
    case 'error':
      fail(msg.text); break;

    case 'welcome':
      myConn = conn;
      document.getElementById('pName').textContent = msg.name;
      document.getElementById('pScore').textContent = msg.score;
      show('player'); break;

    case 'wait':
      pview(`<h2>${esc(msg.text)}</h2>`); break;

    case 'score':
      document.getElementById('pScore').textContent = msg.score; break;

    case 'question': {
      let btns = '';
      for (let i = 0; i < msg.choices; i++)
        btns += `<button class="pbtn c${i}" onclick="answer(${i})">${SHAPES[i]}</button>`;
      pview(`<div class="pgrid">${btns}</div>`);
      break;
    }

    case 'result':
      document.getElementById('pScore').textContent = msg.score;
      if (!msg.answered) pview(`<p class="big">⏰</p><h2>Time's up!</h2><p>You're #${msg.rank} of ${msg.of}</p>`, 'full result-bad');
      else if (msg.correct) pview(`<p class="big">✅</p><h2>Correct! +${msg.points}</h2><p>You're #${msg.rank} of ${msg.of}</p>`, 'full result-ok');
      else pview(`<p class="big">❌</p><h2>Wrong</h2><p>You're #${msg.rank} of ${msg.of}</p>`, 'full result-bad');
      break;

    case 'final': {
      const medal = ['🥇', '🥈', '🥉'][msg.rank - 1] || '🎉';
      pview(`<p class="big">${medal}</p><h2>You finished #${msg.rank} of ${msg.of}</h2><p>${msg.score} points</p>`);
      break;
    }
  }
}

function answer(i) {
  if (myConn && myConn.open) myConn.send({ type: 'answer', choice: i });
  pview('<h2>Answer sent ⏳</h2>');
}

/* QR code opens ?join=1234 → join screen with the code filled in */
const preCode = new URLSearchParams(location.search).get('join');
if (preCode) {
  show('join');
  document.getElementById('codeInput').value = preCode;
  document.getElementById('nameInput').focus();
}
</script>
</body>
</html>
