<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Party Quiz</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#1b1140; --card:#2a1d5e; --accent:#ffcc00; --text:#fff; --muted:#b9b0e0;
          --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .screen { display:none; min-height:100vh; padding:16px; text-align:center; }
  .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font-size:2.2rem; margin:0 0 20px; }
  button { font-size:1.2rem; padding:16px 28px; border:0; border-radius:12px; cursor:pointer;
           background:var(--accent); color:#1b1140; font-weight:700; margin:8px; }
  button:disabled { opacity:.4; cursor:default; }
  button.secondary { background:var(--card); color:var(--text); }
  input { font-size:1.4rem; padding:14px; border-radius:10px; border:0; width:100%;
          max-width:340px; margin:8px 0; text-align:center; }
  .muted { color:var(--muted); }

  /* ---------- TV ---------- */
  .wide { width:100%; max-width:1100px; }
  .code { font-size:6rem; font-weight:800; letter-spacing:12px; color:var(--accent); margin:8px 0; }
  .hostTop { display:flex; gap:32px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #qr { background:#fff; padding:12px; border-radius:12px; }
  #players { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:28px 0; min-height:70px; }
  .chip { background:var(--card); padding:12px 22px; border-radius:40px; font-size:1.5rem;
          font-weight:700; animation:pop .3s ease-out; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }

  .qtop { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:16px; }
  .timer { width:90px; height:90px; border-radius:50%; background:var(--card); display:flex;
           align-items:center; justify-content:center; font-size:2.4rem; font-weight:800; }
  .qtext { background:#fff; color:#222; font-size:2.4rem; font-weight:700; padding:28px;
           border-radius:14px; width:100%; margin-bottom:20px; white-space:pre-line; }
  .qtext.long { font-size:1.7rem; text-align:start; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; }
  .ans { display:flex; align-items:center; gap:16px; padding:22px; border-radius:12px;
         font-size:1.7rem; font-weight:700; text-align:left; transition:opacity .3s; }
  .ans .shape { font-size:2rem; }
  .ans .cnt { margin-left:auto; background:rgba(0,0,0,.25); padding:4px 14px; border-radius:20px; }
  .ans.dim { opacity:.3; }
  .c0 { background:var(--red); } .c1 { background:var(--blue); }
  .c2 { background:var(--yellow); } .c3 { background:var(--green); }

  .board { width:100%; max-width:700px; margin:16px 0; }
  .row { display:flex; justify-content:space-between; background:var(--card); padding:14px 22px;
         border-radius:10px; margin:8px 0; font-size:1.5rem; font-weight:700; }
  .row .plus { color:var(--accent); font-size:1.1rem; margin-left:10px; }
  .row.gold { background:var(--accent); color:#1b1140; }
  .row.gold .plus { color:#1b1140; }

  /* ---------- Phone ---------- */
  #player { padding:0; justify-content:flex-start; }
  .pbar { width:100%; display:flex; justify-content:space-between; padding:12px 16px;
          background:var(--card); font-weight:700; }
  #pview { flex:1; width:100%; display:flex; flex-direction:column; align-items:center;
           justify-content:center; padding:16px; }
  .pq { width:100%; height:calc(100vh - 80px); display:flex; flex-direction:column; gap:12px; }
  .pqtext { background:#fff; color:#222; font-size:1.15rem; font-weight:700; padding:14px;
            border-radius:12px; white-space:pre-line; max-height:45vh; overflow-y:auto; text-align:start; }
  .pqnum { color:var(--muted); font-size:.95rem; }
  .pgrid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:12px; width:100%; }
  .pbtn { border:0; border-radius:14px; color:#fff; margin:0; padding:10px; display:flex;
          flex-direction:column; align-items:center; justify-content:center; gap:8px;
          font-size:1.15rem; font-weight:700; line-height:1.25; word-break:break-word; }
  .pbtn .shape { font-size:2rem; }
  .pbtn:active { transform:scale(.96); }
  .big { font-size:4rem; margin:0; }
  .result-ok { background:var(--green); } .result-bad { background:var(--red); }
  .full { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; }

  /* ---------- Quiz editor ---------- */
  .panel { width:100%; max-width:760px; text-align:left; }
  .panel h1 { text-align:center; }
  .small { font-size:.9rem; }
  .qzRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--card);
           padding:12px 16px; border-radius:12px; margin:10px 0; }
  .qzRow .t { flex:1; min-width:160px; font-size:1.2rem; font-weight:700; }
  button.mini { font-size:1rem; padding:8px 12px; margin:2px; border-radius:8px; }
  button.danger { background:#5b1f2e; color:#fff; }
  .btnRow { display:flex; flex-wrap:wrap; justify-content:center; }
  .edTop { display:flex; justify-content:space-between; align-items:center; position:sticky; top:0;
           background:var(--bg); padding:6px 0; z-index:5; }
  .edInput, .qcard textarea, .arow input.qa { width:100%; max-width:none; text-align:start; font-size:1.15rem;
           padding:12px; border-radius:10px; border:0; margin:6px 0; font-family:inherit; }
  .qcard { background:var(--card); border-radius:14px; padding:14px; margin:14px 0; }
  .qcard.err { outline:3px solid var(--red); }
  .qhead { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .qhead select { font-size:1rem; padding:8px; border-radius:8px; border:0; }
  .qans { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0; }
  .arow { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; }
  .arow .shape { font-size:1.3rem; color:#fff; }
  .arow input.qa { margin:0; padding:10px; font-size:1rem; }
  .arow input.qc { width:26px; height:26px; flex:none; margin:0; padding:0; accent-color:#fff; cursor:pointer; }
  #edMsg { min-height:1.5em; color:#ffb3c0; font-weight:700; text-align:center; margin:8px 0; }
  .quizPick { margin:8px 0 4px; font-size:1.2rem; }
  .quizPick select { font-size:1.1rem; padding:10px; border-radius:10px; border:0; max-width:90vw; }
  @media (max-width:560px) { .qans { grid-template-columns:1fr; } }

  /* ---------- WhatsApp-style chat questions ---------- */
  .chatLayout { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:24px; width:100%; align-items:start; }
  .chatLayout .answers { grid-template-columns:1fr; gap:10px; }
  .chatLayout .ans { font-size:1.5rem; padding:14px 18px; }
  .chatLayout .board { margin:16px 0 0 !important; }
  .chatLayout .row { font-size:1.2rem; padding:10px 16px; margin:6px 0; }
  .wa { background:#0b141a; border-radius:16px; overflow:hidden; text-align:right; display:flex; flex-direction:column;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wa-head { background:#202c33; color:#e9edef; padding:12px 18px; font-weight:600; font-size:1.25rem;
             display:flex; gap:12px; align-items:center; }
  .wa-avatar { width:40px; height:40px; border-radius:50%; background:#6b7c85; display:flex; align-items:center;
               justify-content:center; flex:none; }
  .wa-sub { font-size:.85rem; color:#8696a0; font-weight:400; }

  .wa-date { align-self:center; background:#182229; color:#8696a0; font-size:.95rem; padding:5px 12px; border-radius:8px; margin-bottom:8px; }
  .wa-b { max-width:82%; padding:6px 10px 7px; border-radius:8px; color:#e9edef; font-size:1.4rem; line-height:1.4;
          white-space:pre-line; word-break:break-word; text-align:start; }
  .wa-in { align-self:flex-start; background:#202c33; border-start-start-radius:0; }
  .wa-out { align-self:flex-end; background:#005c4b; border-start-end-radius:0; }
  .wa-name { font-size:1rem; font-weight:700; margin-bottom:1px; }
  .wa-time { font-size:.78rem; color:#8696a0; float:left; margin:9px 12px 0 0; }
  .wa-out .wa-time { color:#a3d4c8; }
  .wa-note { align-self:center; max-width:90%; background:#2a2617; color:#ffd279; font-size:1.05rem; padding:7px 14px;
             border-radius:8px; margin-bottom:8px; text-align:center; white-space:pre-line; }
  .wa-sm .wa-note { font-size:.85rem; }
  .wa-target { box-shadow:0 0 0 3px var(--accent), 0 0 18px rgba(255,204,0,.35); }
  .wa-ask { align-self:flex-start; color:var(--accent); font-weight:700; font-size:1rem; margin:6px 4px 0; }
  .wa-react { animation:waIn .45s ease-out both; }
  .wa-react:nth-last-child(2) { animation-delay:.35s; } .wa-react:nth-last-child(1) { animation-delay:.7s; }
  @keyframes waIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .wa-sm .wa-head { display:none; }
  .wa-sm .wa-body { padding:10px 12px; max-height:none; }
  .wa-sm .wa-b { font-size:1rem; }
  .wa-sm .wa-name { font-size:.8rem; }
  .wa-sm .wa-date { font-size:.8rem; }
  .pqchat { max-height:48vh; overflow-y:auto; border-radius:12px; }
  @media (max-width:820px) { .chatLayout { grid-template-columns:1fr; } .wa-b { font-size:1.1rem; } }
  .chip { display:inline-flex; align-items:center; gap:10px; }
  .chip.off { opacity:.45; }
  button.kick { font-size:.9rem; padding:4px 9px; margin:0; border-radius:20px; background:rgba(255,255,255,.12); color:var(--text); }
  button.kick:hover, button.kick:focus-visible { background:var(--red); }
  #playersBtn { position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px));
                font-size:1rem; padding:12px 18px; margin:0; z-index:40; }
  #playersPanel { position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); bottom:calc(76px + env(safe-area-inset-bottom, 0px));
                  width:min(360px, calc(100vw - 32px)); max-height:60vh; overflow-y:auto; background:var(--card); border-radius:14px;
                  padding:12px; z-index:40; box-shadow:0 10px 40px rgba(0,0,0,.5); text-align:start; }
  .prow { display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.08); }
  .prow .nm { flex:1; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .dot { width:10px; height:10px; border-radius:50%; background:#3ddc84; flex:none; }
  .dot.off { background:#8a83b0; }
  .previewBar { position:fixed; left:16px; bottom:16px; display:flex; gap:8px; z-index:50; }
  .previewBar button { font-size:1rem; padding:12px 18px; margin:0; }
</style>
</head>
<body>

<!-- ================= Home ================= -->
<div class="screen active" id="home">
  <h1>🎉 Party Quiz</h1>
  <button onclick="startHost()">📺 Host on TV</button>
  <button class="secondary" onclick="show('join')">📱 Join with phone</button>
  <button class="secondary" onclick="openQuizList()">✏️ My quizzes</button>
  <div id="rejoinBox" hidden style="margin-top:18px">
    <button id="rejoinBtn" onclick="rejoin()"></button>
  </div>
</div>

<!-- ================= Quiz list ================= -->
<div class="screen" id="quizzes">
  <div class="panel">
    <h1>✏️ My quizzes</h1>
    <div id="quizList"></div>
    <div class="btnRow">
      <button onclick="newQuiz()">➕ New quiz</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">📂 Import file</button>
      <button class="secondary back" onclick="history.back()">⬅ Back</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importQuiz(this)">
    <p class="muted small" style="text-align:center">Quizzes are saved in this browser. Create them on the device
      you'll host from, or use Export / Import to move them to another device.</p>
  </div>
</div>

<!-- ================= Quiz editor ================= -->
<div class="screen" id="editor">
  <div class="panel">
    <div class="edTop">
      <button class="secondary mini back" onclick="closeEditor()">⬅ Back</button>
      <button class="mini" onclick="saveQuiz()">💾 Save</button>
    </div>
    <input id="qzTitle" class="edInput" dir="auto" maxlength="60" placeholder="Quiz name">
    <div id="qcards"></div>
    <div class="btnRow"><button class="secondary" onclick="addQuestion()">➕ Add question</button></div>
    <div id="edMsg"></div>
    <div class="btnRow"><button onclick="saveQuiz()">💾 Save quiz</button></div>
  </div>
</div>

<!-- ================= TV: lobby ================= -->
<div class="screen" id="lobby">
  <div class="wide">
    <div style="text-align:start"><button class="secondary mini back" onclick="history.back()">⬅ Back</button></div>
    <div class="hostTop">
      <div>
        <div class="muted">Open this site on your phone and enter:</div>
        <div class="code" id="roomCode">····</div>
        <div class="muted" id="hostStatus">Creating room…</div>
      </div>
      <div id="qr"></div>
    </div>
    <div id="players"></div>
    <div class="muted" id="count">Waiting for players…</div>
    <div class="quizPick"><span class="muted">Quiz:</span> <select id="quizSelect"></select></div>
    <button id="startBtn" onclick="startGame()" disabled>▶ Start game</button>
  </div>
</div>

<!-- ================= TV: game (question / reveal / final) ================= -->
<div class="screen" id="game"><div class="wide" id="gameView"></div></div>
<button id="playersBtn" class="secondary back" hidden onclick="togglePlayers()">👥 Players</button>
<div id="playersPanel" hidden></div>
<div class="previewBar" id="previewBar" style="display:none">
  <button onclick="endQuestion()">👁 Reveal</button>
  <button class="secondary" onclick="location.reload()">✖ Exit preview</button>
</div>

<!-- ================= Phone: join ================= -->
<div class="screen" id="join">
  <h1>Join a room</h1>
  <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="Room code"><br>
  <input id="nameInput" maxlength="16" placeholder="Your name"><br>
  <button id="joinBtn" onclick="joinRoom()">Join</button>
  <button class="secondary back" onclick="history.back()">⬅ Back</button>
  <div id="status" class="muted" style="margin-top:14px;min-height:1.4em"></div>
</div>

<!-- ================= Phone: in game ================= -->
<div class="screen" id="player">
  <div class="pbar"><span id="pName"></span><span id="pScore">0</span></div>
  <div id="pview"></div>
</div>

<script>
/* =========================================================
   Built-in demo quiz (always available, can't be deleted).
   Your own quizzes are made in "✏️ My quizzes".
   correct = index of the right answer (0 = first)
   ========================================================= */
const DEMO_QUIZ = { id: 'demo', title: 'Demo quiz', questions: [
  { q: "What is the capital of Australia?",      a: ["Sydney", "Canberra", "Melbourne", "Perth"], correct: 1, time: 20 },
  { q: "How many bits are in a byte?",            a: ["4", "8", "16", "32"],                       correct: 1, time: 20 },
  { q: "Which planet is called the Red Planet?",  a: ["Venus", "Jupiter", "Mars", "Saturn"],       correct: 2, time: 20 },
  { q: "What does CPU stand for?",                a: ["Central Processing Unit", "Computer Power Unit",
                                                      "Core Process Utility", "Central Program Uploader"], correct: 0, time: 20 },
  { q: "At sea level, water boils at…",           a: ["90 °C", "100 °C", "110 °C", "120 °C"],     correct: 1, time: 20 },
]};
let QUESTIONS = [];           // filled from the chosen quiz when a game starts
const DURATION = 20;          // default seconds per question
let qDur = DURATION;
const MAX_POINTS = 1000;      // fast correct answer ≈ 1000, slow correct ≈ 500

const PREFIX = "partyquiz-demo-g7k2-";   // keeps our room IDs unique on the free PeerJS server
const SHAPES = ["▲", "◆", "●", "■"];

let current = 'home';
// every screen change is a browser history step, so the browser's Back button works
function show(id, push = true) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (push && id !== current) { try { history.pushState({ screen: id }, '', '#' + id); } catch (e) {} }
  current = id;
}
let hostPeer = null;
window.addEventListener('popstate', e => {
  const target = (e.state && e.state.screen) || 'home';
  const stay = () => { try { history.pushState({ screen: current }, '', '#' + current); } catch (err) {} };
  if (current === 'lobby' || current === 'game') {          // leaving the TV: close the room
    const mid = !previewMode && (phase === 'question' || phase === 'reveal');
    if (mid && !confirm('Leave the game? The room will close for everyone.')) { stay(); return; }
    location.href = location.pathname; return;
  }
  if (current === 'player') {                                // phone leaving a game
    if (!confirm('Leave the game?')) { stay(); return; }
    location.href = location.pathname; return;
  }
  if (current === 'editor' && dirty && !confirm('Leave without saving?')) { stay(); return; }
  if (target === 'quizzes') renderQuizList();
  show(target, false);
});
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   HOST (TV)
   ========================================================= */
const players = new Map();   // key (lowercase name) -> { name, conn, connected, score, answer, elapsed, lastPoints }
let phase = 'lobby';         // lobby | question | reveal | final
let qIndex = -1, qStart = 0, timerId = null;

function startHost() {
  show('lobby');
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const peer = new Peer(PREFIX + code);
  hostPeer = peer;

  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('hostStatus').textContent = 'Room is open';
    const joinUrl = location.origin + location.pathname + '?join=' + code;
    document.getElementById('qr').innerHTML = '';
    new QRCode(document.getElementById('qr'), { text: joinUrl, width: 160, height: 160 });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); startHost(); }
    else document.getElementById('hostStatus').textContent = 'Error: ' + err.type;
  });
  peer.on('connection', handleConnection);
  renderQuizSelect();

  // Space / Enter presses the main button on the TV
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const btn = document.querySelector('.screen.active button:not(:disabled):not(.back):not(.kick)');
    if (btn) { e.preventDefault(); btn.click(); }
  });
}

function handleConnection(conn) {
  conn.on('data', msg => {
    if (msg.type === 'join') {
      const name = String(msg.name || '').trim().slice(0, 16);
      const key = name.toLowerCase();
      if (!name) return;
      const token = String(msg.token || '');
      if (banned.has(key) || (token && bannedTokens.has(token))) { conn.send({ type: 'kicked' }); return; }
      const existing = players.get(key);
      // same name on a different phone that is still online = taken
      if (existing && existing.connected && existing.token !== token) { conn.send({ type: 'error', text: 'That name is taken' }); return; }

      // New player, or the same phone coming back (keeps the score, replaces the old connection)
      const p = existing || { name, score: 0, answer: null, elapsed: 0, lastPoints: 0 };
      const old = p.conn;
      p.conn = conn; p.connected = true; p.token = token; conn._key = key;
      players.set(key, p);
      if (old && old !== conn) { try { old.close(); } catch (e) {} }
      conn.send({ type: 'welcome', name: p.name, score: p.score });
      syncPlayer(p);
      refreshHost();
    }
    else if (msg.type === 'answer') {
      const p = players.get(conn._key);
      if (p && p.conn === conn) onAnswer(p, msg.choice);
    }
  });
  conn.on('close', () => {
    const p = players.get(conn._key);
    if (!p || p.conn !== conn) return;
    p.connected = false;
    if (phase === 'lobby') players.delete(conn._key);
    refreshHost();
    maybeEndEarly();
  });
}

/* ---------- host controls: remove players ---------- */
const banned = new Set(), bannedTokens = new Set();
function kick(key) {
  const p = players.get(key);
  if (!p || !confirm(`Remove ${p.name} from the room?`)) return;
  banned.add(key); if (p.token) bannedTokens.add(p.token);
  send(p, { type: 'kicked' });
  const c = p.conn; setTimeout(() => { try { c && c.close(); } catch (e) {} }, 300);
  players.delete(key);
  refreshHost();
  maybeEndEarly();
}
function maybeEndEarly() {
  if (phase !== 'question') return;
  const online = connectedPlayers();
  if (online.length > 0 && online.every(x => x.answer !== null)) endQuestion();
}
function togglePlayers() {
  const panel = document.getElementById('playersPanel');
  panel.hidden = !panel.hidden;
  renderPlayersPanel();
}
function renderPlayersPanel() {
  const panel = document.getElementById('playersPanel');
  if (panel.hidden) return;
  panel.innerHTML = '';
  if (!players.size) { panel.textContent = 'No players'; return; }
  players.forEach((p, key) => {
    const row = document.createElement('div'); row.className = 'prow';
    const dot = document.createElement('span'); dot.className = 'dot' + (p.connected ? '' : ' off');
    dot.title = p.connected ? 'Online' : 'Offline — can rejoin with the same name';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
    const sc = document.createElement('span'); sc.className = 'muted'; sc.textContent = p.connected ? p.score : p.score + ' · offline';
    const b = document.createElement('button'); b.className = 'kick'; b.textContent = '✖ Remove';
    b.onclick = () => kick(key);
    row.append(dot, nm, sc, b); panel.appendChild(row);
  });
}

// Tell a (re)joining phone what's going on right now
function syncPlayer(p) {
  if (phase === 'lobby') send(p, { type: 'wait', text: 'You\'re in! Watch the TV.' });
  else if (phase === 'question' && p.answer === null) send(p, questionMsg());
  else if (phase === 'question') send(p, { type: 'wait', text: 'Answer sent ⏳' });
  else send(p, { type: 'wait', text: 'Get ready for the next question…' });
}

function send(p, msg) { if (p.connected && p.conn.open) p.conn.send(msg); }
function broadcast(msg) { players.forEach(p => send(p, msg)); }
function connectedPlayers() { return [...players.values()].filter(p => p.connected); }

function refreshHost() {
  if (phase === 'lobby') renderLobby();
  else if (phase === 'question') updateAnsweredCount();
  renderPlayersPanel();
}

function renderLobby() {
  const box = document.getElementById('players');
  box.innerHTML = '';
  players.forEach((p, key) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (p.connected ? '' : ' off');
    const nm = document.createElement('span'); nm.textContent = p.name;
    const b = document.createElement('button'); b.className = 'kick'; b.textContent = '✖';
    b.setAttribute('aria-label', 'Remove ' + p.name); b.onclick = () => kick(key);
    chip.append(nm, b);
    box.appendChild(chip);
  });
  const n = connectedPlayers().length;
  document.getElementById('count').textContent =
    n === 0 ? 'Waiting for players…' : n + (n === 1 ? ' player' : ' players') + ' connected';
  document.getElementById('startBtn').disabled = n === 0;
}

/* ---------- game flow ---------- */
function startGame() {
  const id = document.getElementById('quizSelect').value;
  const quiz = allQuizzes().find(z => z.id === id) || DEMO_QUIZ;
  QUESTIONS = toPlayable(quiz);
  lsSet(LAST_KEY, quiz.id);
  players.forEach((p, key) => { if (!p.connected) players.delete(key); });
  players.forEach(p => { p.score = 0; });
  qIndex = -1;
  show('game');
  document.getElementById('playersBtn').hidden = false;
  nextQuestion();
}

function questionMsg() {
  const q = QUESTIONS[qIndex];
  return { type: 'question', n: qIndex + 1, total: QUESTIONS.length, q: q.q, answers: q.a,
           chat: q.chat ? chatForPhone(q.chat) : null };
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= QUESTIONS.length) { showFinal(); return; }
  phase = 'question';
  players.forEach(p => { p.answer = null; p.lastPoints = 0; });

  const q = QUESTIONS[qIndex];
  qDur = q.time || DURATION;
  document.getElementById('gameView').innerHTML = `
    <div class="qtop">
      <div class="muted">Question ${qIndex + 1} / ${QUESTIONS.length}</div>
      <div class="timer" id="timer">${qDur}</div>
      <div class="muted" id="answered">0 answers</div>
    </div>
    ${q.chat ? `<div class="chatLayout"><div id="chatBox">${chatHtml(q.chat, false)}</div><div id="sideBox">${answersHtml(q)}</div></div>`
             : `<div class="qtext${q.q.length > 90 ? ' long' : ''}" dir="auto">${esc(q.q)}</div>${answersHtml(q)}`}`;

  qStart = performance.now();
  broadcast(questionMsg());
  if (previewMode) setTimeout(() => { if (phase === 'question') fakeAnswers(); }, 1500);
  clearInterval(timerId);
  timerId = setInterval(() => {
    const left = Math.max(0, qDur - (performance.now() - qStart) / 1000);
    const el = document.getElementById('timer');
    if (el) el.textContent = Math.ceil(left);
    if (left <= 0) endQuestion();
  }, 200);
}

/* ---------- preview: play a quiz on this screen with 3 fake players ---------- */
let previewMode = false;
function startPreview(id) {
  const quiz = window.PREVIEW_QUIZ || allQuizzes().find(z => z.id === id) || DEMO_QUIZ;
  QUESTIONS = toPlayable(quiz);
  previewMode = true;
  players.clear();
  ['Player A', 'Player B', 'Player C'].forEach(n =>
    players.set(n, { name: n, score: 0, answer: null, elapsed: 0, lastPoints: 0, connected: false, conn: null }));
  qIndex = -1;
  show('game');
  document.getElementById('previewBar').style.display = 'flex';
  nextQuestion();
}
function fakeAnswers() {
  const q = QUESTIONS[qIndex];
  players.forEach(p => {
    p.answer = Math.random() < 0.55 ? q.correct : Math.floor(Math.random() * q.a.length);
    p.elapsed = 2 + Math.random() * (qDur * 0.6);
  });
  updateAnsweredCount();
}

function answersHtml(q) {
  return `<div class="answers">${q.a.map((t, i) => `<div class="ans c${i}" id="ans${i}">
      <span class="shape">${SHAPES[i]}</span><span dir="auto">${esc(t)}</span></div>`).join('')}</div>`;
}

function onAnswer(p, choice) {
  if (phase !== 'question' || p.answer !== null) return;
  if (!Number.isInteger(choice) || choice < 0 || choice >= QUESTIONS[qIndex].a.length) return;
  p.answer = choice;
  p.elapsed = (performance.now() - qStart) / 1000;   // measured on the TV, so phone clocks don't matter
  send(p, { type: 'wait', text: 'Answer sent ⏳' });
  updateAnsweredCount();
  maybeEndEarly();
}

function updateAnsweredCount() {
  const n = [...players.values()].filter(p => p.answer !== null).length;
  const el = document.getElementById('answered');
  if (el) el.textContent = n + (n === 1 ? ' answer' : ' answers');
}

function ranking() { return [...players.values()].sort((a, b) => b.score - a.score); }

function endQuestion() {
  if (phase !== 'question') return;
  phase = 'reveal';
  clearInterval(timerId);
  const q = QUESTIONS[qIndex];

  // score
  players.forEach(p => {
    const right = p.answer === q.correct;
    p.lastPoints = right ? Math.round(MAX_POINTS * (1 - 0.5 * Math.min(1, p.elapsed / qDur))) : 0;
    p.score += p.lastPoints;
  });
  const ranked = ranking();
  ranked.forEach((p, i) => send(p, {
    type: 'result', answered: p.answer !== null, correct: p.answer === q.correct,
    points: p.lastPoints, score: p.score, rank: i + 1, of: ranked.length
  }));

  // show correct answer + how many picked each
  q.a.forEach((_, i) => {
    const box = document.getElementById('ans' + i);
    const cnt = [...players.values()].filter(p => p.answer === i).length;
    box.insertAdjacentHTML('beforeend', `<span class="cnt">${cnt}</span>`);
    if (i !== q.correct) box.classList.add('dim'); else box.insertAdjacentHTML('afterbegin', '✔');
  });
  document.getElementById('timer').textContent = '✓';
  if (q.chat) document.getElementById('chatBox').innerHTML = chatHtml(q.chat, true);

  const last = qIndex === QUESTIONS.length - 1;
  (document.getElementById('sideBox') || document.getElementById('gameView')).insertAdjacentHTML('beforeend', `
    <div class="board" style="margin:20px auto">
      ${ranked.slice(0, 5).map((p, i) => `<div class="row ${i === 0 ? 'gold' : ''}">
        <span>${i + 1}. ${esc(p.name)}</span>
        <span>${p.score}${p.lastPoints ? `<span class="plus">+${p.lastPoints}</span>` : ''}</span></div>`).join('')}
    </div>
    <button onclick="nextQuestion()">${last ? '🏆 Final results' : 'Next question ▶'}</button>`);
}

function showFinal() {
  phase = 'final';
  const ranked = ranking();
  const medals = ['🥇', '🥈', '🥉'];
  document.getElementById('gameView').innerHTML = `
    <h1>🏆 Final results</h1>
    <div class="board" style="margin:0 auto 20px">
      ${ranked.map((p, i) => `<div class="row ${i === 0 ? 'gold' : ''}">
        <span>${medals[i] || (i + 1) + '.'} ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}
    </div>
    <button onclick="backToLobby()">🔁 Play again</button>`;
  ranked.forEach((p, i) => send(p, { type: 'final', rank: i + 1, of: ranked.length, score: p.score }));
}

function backToLobby() {
  if (previewMode) { location.reload(); return; }
  phase = 'lobby';
  players.forEach((p, key) => { if (!p.connected) players.delete(key); else p.score = 0; });
  broadcast({ type: 'wait', text: 'New game soon! Watch the TV.' });
  broadcast({ type: 'score', score: 0 });
  show('lobby');
  renderLobby();
}

/* =========================================================
   PLAYER (phone)
   ========================================================= */
let myConn = null, myPeer = null, session = null, kicked = false, retries = 0, retryTimer = null;
const SESSION_KEY = 'partyquiz.session';
const MAX_RETRIES = 15;          // about 30 seconds of automatic reconnecting

// a random id for this phone, so the TV knows it's the same player coming back
function deviceToken() {
  let t = lsGet('partyquiz.device');
  if (!t) { t = newId(); lsSet('partyquiz.device', t); }
  return t;
}
function savedSession() {
  try { const s = JSON.parse(lsGet(SESSION_KEY)); return s && Date.now() - s.at < 6 * 3600e3 ? s : null; } catch (e) { return null; }
}

function joinRoom() {
  const code = document.getElementById('codeInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  const status = document.getElementById('status');
  if (!/^\d{4}$/.test(code)) { status.textContent = 'Enter the 4-digit code'; return; }
  if (!name) { status.textContent = 'Enter your name'; return; }
  status.textContent = 'Connecting…';
  document.getElementById('joinBtn').disabled = true;
  connectTo(code, name, true);
}

function connectTo(code, name, fromForm) {
  clearTimeout(retryTimer);
  if (myPeer) { try { myPeer.destroy(); } catch (e) {} }
  const peer = new Peer();
  myPeer = peer;
  const fail = (text, roomGone) => {
    if (peer !== myPeer) return;
    if (fromForm && !myConn) {
      document.getElementById('status').textContent = text;
      document.getElementById('joinBtn').disabled = false;
      try { peer.destroy(); } catch (e) {}
    } else lost(roomGone ? 'The room is closed' : text, roomGone);
  };
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => conn.send({ type: 'join', name, token: deviceToken() }));
    conn.on('data', msg => onHostMessage(msg, conn, fail, code));
    conn.on('close', () => { if (myConn === conn) lost(); });
  });
  peer.on('error', err => fail(err.type === 'peer-unavailable' ? 'Room not found — check the code' : 'Connection problem (' + err.type + ')',
                               err.type === 'peer-unavailable'));
}

// connection dropped (phone slept, Wi-Fi blinked…): keep trying with the same name
function lost(reason, stop) {
  if (kicked || !session) return;
  myConn = null;
  if (stop || retries >= MAX_RETRIES) {
    pview(`<p class="big">📴</p><h2>${esc(reason || 'Disconnected')}</h2>
      <p class="muted">Your score is kept. Tap to come back.</p>
      <button onclick="rejoin()">↩ Rejoin as ${esc(session.name)}</button>`);
    return;
  }
  retries++;
  pview(`<p class="big">🔄</p><h2>Reconnecting…</h2><p class="muted">Try ${retries} of ${MAX_RETRIES}</p>`);
  retryTimer = setTimeout(() => connectTo(session.code, session.name, false), 2000);
}
function rejoin() {
  session = session || savedSession();
  if (!session) { show('join'); return; }
  retries = 0; kicked = false;
  show('player');
  document.getElementById('pName').textContent = session.name;
  pview('<h2>Connecting…</h2>');
  connectTo(session.code, session.name, false);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && current === 'player' && session && !kicked && !(myConn && myConn.open)) {
    retries = 0; connectTo(session.code, session.name, false);
  }
});

function pview(html, cls = '') {
  const v = document.getElementById('pview');
  v.className = cls;
  v.innerHTML = html;
}

function onHostMessage(msg, conn, fail, code) {
  switch (msg.type) {
    case 'error':
      fail(msg.text, true); break;

    case 'kicked':
      kicked = true; myConn = null;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      show('player');
      pview('<p class="big">🚫</p><h2>You were removed from the room</h2>');
      try { myPeer && myPeer.destroy(); } catch (e) {}
      break;

    case 'welcome':
      myConn = conn; retries = 0;
      session = { code, name: msg.name, at: Date.now() };
      lsSet(SESSION_KEY, JSON.stringify(session));
      document.getElementById('pName').textContent = msg.name;
      document.getElementById('pScore').textContent = msg.score;
      show('player'); break;

    case 'wait':
      pview(`<h2>${esc(msg.text)}</h2>`); break;

    case 'score':
      document.getElementById('pScore').textContent = msg.score; break;

    case 'question': {
      const btns = msg.answers.map((t, i) =>
        `<button class="pbtn c${i}" onclick="answer(${i})">
           <span class="shape">${SHAPES[i]}</span><span dir="auto">${esc(t)}</span></button>`).join('');
      pview(`<div class="pq">
        ${msg.chat ? `<div class="pqchat">${chatHtml(msg.chat, false, true)}</div>`
          : `<div class="pqtext"><div class="pqnum">Question ${msg.n} / ${msg.total}</div><div dir="auto">${esc(msg.q)}</div></div>`}
        <div class="pgrid">${btns}</div></div>`);
      break;
    }

    case 'result':
      document.getElementById('pScore').textContent = msg.score;
      if (!msg.answered) pview(`<p class="big">⏰</p><h2>Time's up!</h2><p>You're #${msg.rank} of ${msg.of}</p>`, 'full result-bad');
      else if (msg.correct) pview(`<p class="big">✅</p><h2>Correct! +${msg.points}</h2><p>You're #${msg.rank} of ${msg.of}</p>`, 'full result-ok');
      else pview(`<p class="big">❌</p><h2>Wrong</h2><p>You're #${msg.rank} of ${msg.of}</p>`, 'full result-bad');
      break;

    case 'final': {
      const medal = ['🥇', '🥈', '🥉'][msg.rank - 1] || '🎉';
      pview(`<p class="big">${medal}</p><h2>You finished #${msg.rank} of ${msg.of}</h2><p>${msg.score} points</p>`);
      break;
    }
  }
}

function answer(i) {
  if (myConn && myConn.open) myConn.send({ type: 'answer', choice: i });
  pview('<h2>Answer sent ⏳</h2>');
}

/* =========================================================
   WHATSAPP-STYLE CHAT QUESTIONS
   q.chat = { date, lines: [{ who, text, time, target?, react? }] }
   target = the message to guess, react = laughs shown only on reveal
   ========================================================= */
const WA_GROUP = 'הבאפ וחבר ועודד';
const WA_ME = 'יונתן';     // the chat was exported from this phone: his bubbles are green on reveal
const WA_COLORS = { 'איתי': '#53bdeb', 'עודד': '#ffbc38', 'שגיא': '#06cf9c', 'ירדן': '#fc9775', 'ירין': '#e542a3', 'יונתן': '#a5b337' };
const WA_AVATAR = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 13.6c2.9.2 5 2.2 5 5.4"></path></svg>';

function chatHtml(chat, reveal, small) {
  const lines = chat.lines.filter(l => reveal || !l.react);
  let asked = false;
  const body = lines.map(l => {
    const out = reveal && l.who === WA_ME;
    const name = !reveal ? '<div class="wa-name" style="color:#8696a0">???</div>'
               : out ? '' : `<div class="wa-name" style="color:${WA_COLORS[l.who] || '#8696a0'}">${esc(l.who)}</div>`;
    const ask = l.target && !reveal && !asked ? (asked = true, '<div class="wa-ask">מי שלח את זה? 👇</div>') : '';
    return `${ask}<div class="wa-b ${out ? 'wa-out' : 'wa-in'}${l.target ? ' wa-target' : ''}${l.react ? ' wa-react' : ''}">`
         + `${name}<span dir="auto">${esc(l.text)}</span><span class="wa-time">${esc(l.time || '')}</span></div>`;
  }).join('');
  return `<div class="wa${small ? ' wa-sm' : ''}" dir="rtl">
    <div class="wa-head"><span class="wa-avatar">${WA_AVATAR}</span>
      <div><div>${WA_GROUP}</div><div class="wa-sub">${reveal ? 'איתי, ירדן, ירין, עודד, שגיא, את/ה' : 'השמות מוסתרים 🤫'}</div></div></div>
    <div class="wa-body"><div class="wa-date">${esc(chat.date || '')}</div>
      ${chat.note ? `<div class="wa-note" dir="auto">💡 ${esc(chat.note)}</div>` : ''}${body}</div></div>`;
}
// what the phones get: no names, no reactions
function chatForPhone(chat) {
  return { date: chat.date, note: chat.note, lines: chat.lines.filter(l => !l.react).map(l => ({ text: l.text, time: l.time, target: !!l.target })) };
}

/* =========================================================
   QUIZ STORAGE + EDITOR
   Saved in this browser's localStorage.
   ========================================================= */
const LS_KEY = 'partyquiz.quizzes';
const LAST_KEY = 'partyquiz.lastQuiz';
const TIMES = [10, 20, 30, 60];
let editing = null;      // quiz being edited
let dirty = false;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function loadQuizzes() { try { return JSON.parse(lsGet(LS_KEY)) || []; } catch (e) { return []; } }
function storeQuizzes(list) {
  if (!lsSet(LS_KEY, JSON.stringify(list))) { alert('Could not save in this browser (private mode?)'); return false; }
  return true;
}
function allQuizzes() { return [DEMO_QUIZ, ...loadQuizzes()]; }
function newId() { return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function blankQuestion() { return { q: '', a: ['', '', '', ''], correct: -1, time: DURATION }; }

// Editor format (always 4 answer slots) -> game format (only filled answers)
function toPlayable(quiz) {
  return quiz.questions.map(x => {
    const a = [], idx = [];
    x.a.forEach((t, j) => { if (String(t).trim()) { idx.push(j); a.push(String(t).trim()); } });
    return { q: String(x.q).trim(), a, correct: idx.indexOf(x.correct), time: x.time || DURATION, chat: x.chat };
  });
}

function renderQuizSelect() {
  const sel = document.getElementById('quizSelect');
  const last = lsGet(LAST_KEY);
  sel.innerHTML = allQuizzes().map(z =>
    `<option value="${esc(z.id)}" ${z.id === last ? 'selected' : ''}>${esc(z.title)} (${z.questions.length})</option>`).join('');
}

/* ---------- list ---------- */
function openQuizList() { renderQuizList(); show('quizzes'); }

function renderQuizList() {
  const mine = loadQuizzes();
  const row = (z, buttons) => `<div class="qzRow"><span class="t" dir="auto">${esc(z.title)}</span>
      <span class="muted small">${z.questions.length} questions</span>${buttons}</div>`;
  document.getElementById('quizList').innerHTML =
    row(DEMO_QUIZ, `<button class="mini secondary" onclick="copyQuiz('demo')">📄 Copy & edit</button>`) +
    (mine.length ? mine.map(z => row(z, `
      <button class="mini" onclick="startPreview('${z.id}')">👁 Preview</button>
      <button class="mini" onclick="editQuiz('${z.id}')">✏️ Edit</button>
      <button class="mini secondary" onclick="copyQuiz('${z.id}')">📄 Copy</button>
      <button class="mini secondary" onclick="exportQuiz('${z.id}')">⬇ Export</button>
      <button class="mini danger" onclick="deleteQuiz('${z.id}')">🗑</button>`)).join('')
      : '<p class="muted" style="text-align:center">No quizzes of your own yet — tap “New quiz”.</p>');
}

function newQuiz() { openEditor({ id: newId(), title: '', questions: [blankQuestion()] }); }
function editQuiz(id) {
  const z = loadQuizzes().find(x => x.id === id);
  if (z) openEditor(JSON.parse(JSON.stringify(z)));
}
function copyQuiz(id) {
  const z = allQuizzes().find(x => x.id === id);
  if (!z) return;
  const c = JSON.parse(JSON.stringify(z));
  c.id = newId(); c.title = z.title + ' (copy)';
  openEditor(c);
}
function deleteQuiz(id) {
  const z = loadQuizzes().find(x => x.id === id);
  if (!z || !confirm(`Delete “${z.title}”?`)) return;
  storeQuizzes(loadQuizzes().filter(x => x.id !== id));
  renderQuizList();
}
function exportQuiz(id) {
  const z = loadQuizzes().find(x => x.id === id);
  if (!z) return;
  const blob = new Blob([JSON.stringify({ title: z.title, questions: z.questions }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (z.title.replace(/[\\/:*?"<>|]+/g, '').trim() || 'quiz') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importQuiz(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!Array.isArray(d.questions)) throw new Error('no questions');
      const quiz = {
        id: newId(),
        title: String(d.title || 'Imported quiz').slice(0, 60),
        questions: d.questions.map(x => ({
          q: String(x.q || ''),
          a: [0, 1, 2, 3].map(j => String((x.a || [])[j] || '')),
          correct: Number.isInteger(x.correct) ? x.correct : -1,
          time: TIMES.includes(x.time) ? x.time : DURATION,
          chat: (x.chat && Array.isArray(x.chat.lines)) ? {
            date: String(x.chat.date || ''),
            note: x.chat.note ? String(x.chat.note).slice(0, 140) : undefined,
            lines: x.chat.lines.slice(0, 40).map(l => ({ who: String(l.who || ''), text: String(l.text || ''),
              time: String(l.time || ''), target: !!l.target, react: !!l.react }))
          } : undefined
        }))
      };
      const list = loadQuizzes(); list.push(quiz);
      if (storeQuizzes(list)) renderQuizList();
    } catch (e) { alert('That file is not a quiz file.'); }
  };
  reader.readAsText(file);
}

/* ---------- editor ---------- */
function openEditor(quiz) {
  editing = quiz; dirty = false;
  document.getElementById('qzTitle').value = quiz.title;
  document.getElementById('edMsg').textContent = '';
  renderCards();
  show('editor');
  window.scrollTo(0, 0);
}

function renderCards() {
  const n = editing.questions.length;
  document.getElementById('qcards').innerHTML = editing.questions.map((q, i) => `
    <div class="qcard" id="qcard${i}">
      <div class="qhead">
        <b>Question ${i + 1}</b>
        <span>
          <select class="qt" title="Time to answer">
            ${TIMES.map(t => `<option value="${t}" ${t === (q.time || DURATION) ? 'selected' : ''}>⏱ ${t}s</option>`).join('')}
          </select>
          <button class="mini secondary" onclick="moveQ(${i},-1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
          <button class="mini secondary" onclick="moveQ(${i},1)" ${i === n - 1 ? 'disabled' : ''} title="Move down">↓</button>
          <button class="mini danger" onclick="delQ(${i})" title="Delete question">🗑</button>
        </span>
      </div>
      ${q.chat ? `<input class="qnote edInput" dir="auto" maxlength="140" value="${esc(q.chat.note || '')}"
         placeholder="💡 Note shown above the chat (optional), e.g. who someone is">` : ''}
      <textarea class="qq" rows="2" dir="auto" maxlength="1000" placeholder="Type the question">${esc(q.q)}</textarea>
      <div class="qans">
        ${[0, 1, 2, 3].map(j => `
          <div class="arow c${j}">
            <span class="shape">${SHAPES[j]}</span>
            <input class="qa" dir="auto" maxlength="80" value="${esc(q.a[j] || '')}"
                   placeholder="Answer ${j + 1}${j >= 2 ? ' (optional)' : ''}">
            <input type="radio" class="qc" name="correct${i}" value="${j}" ${q.correct === j ? 'checked' : ''} title="This is the correct answer">
          </div>`).join('')}
      </div>
      <div class="muted small">Tick the circle next to the correct answer.${q.chat ? ' · 💬 WhatsApp-style question: the chat itself comes from the imported file.' : ''}</div>
    </div>`).join('');
}

// read what's typed on screen back into `editing`
function collectEditor() {
  editing.title = document.getElementById('qzTitle').value.trim();
  const prev = editing.questions;
  editing.questions = [...document.querySelectorAll('.qcard')].map((card, i) => {
    const c = card.querySelector('.qc:checked');
    return {
      chat: prev[i] && prev[i].chat
        ? Object.assign({}, prev[i].chat, { note: (card.querySelector('.qnote') || {}).value?.trim() || undefined })
        : undefined,
      q: card.querySelector('.qq').value.trim(),
      a: [...card.querySelectorAll('.qa')].map(inp => inp.value.trim()),
      correct: c ? Number(c.value) : -1,
      time: Number(card.querySelector('.qt').value)
    };
  });
}

function addQuestion() {
  collectEditor();
  editing.questions.push(blankQuestion());
  dirty = true;
  renderCards();
  const last = document.getElementById('qcard' + (editing.questions.length - 1));
  last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  last.querySelector('.qq').focus();
}
function delQ(i) {
  collectEditor();
  if (editing.questions[i].q && !confirm('Delete this question?')) return;
  editing.questions.splice(i, 1);
  dirty = true;
  renderCards();
}
function moveQ(i, d) {
  collectEditor();
  const qs = editing.questions;
  [qs[i], qs[i + d]] = [qs[i + d], qs[i]];
  dirty = true;
  renderCards();
}

function validateQuiz(z) {
  if (!z.title) return { msg: 'Give your quiz a name' };
  if (!z.questions.length) return { msg: 'Add at least one question' };
  for (let i = 0; i < z.questions.length; i++) {
    const x = z.questions[i];
    if (!x.q) return { i, msg: `Question ${i + 1}: type the question` };
    if (x.a.filter(Boolean).length < 2) return { i, msg: `Question ${i + 1}: needs at least 2 answers` };
    if (x.correct < 0 || !x.a[x.correct]) return { i, msg: `Question ${i + 1}: tick the correct answer` };
  }
  return null;
}

function saveQuiz() {
  collectEditor();
  document.querySelectorAll('.qcard.err').forEach(c => c.classList.remove('err'));
  const err = validateQuiz(editing);
  const msg = document.getElementById('edMsg');
  if (err) {
    msg.textContent = '⚠ ' + err.msg;
    const target = err.i !== undefined ? document.getElementById('qcard' + err.i) : document.getElementById('qzTitle');
    if (err.i !== undefined) target.classList.add('err');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const list = loadQuizzes();
  const at = list.findIndex(x => x.id === editing.id);
  if (at >= 0) list[at] = editing; else list.push(editing);
  if (!storeQuizzes(list)) return;
  dirty = false;
  history.back();
}

function closeEditor() {
  if (dirty && !confirm('Leave without saving?')) return;
  dirty = false;
  history.back();
}
document.getElementById('editor').addEventListener('input', () => { dirty = true; });
document.getElementById('editor').addEventListener('change', () => { dirty = true; });

try { history.replaceState({ screen: 'home' }, '', location.pathname + location.search); } catch (e) {}

if (preCode) {

}
