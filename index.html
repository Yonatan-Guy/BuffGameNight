<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי שלח?</title>
<meta name="description" content="Party game for your group chat: the funniest messages with the names hidden. Everyone guesses who sent it from their phone.">
<meta name="theme-color" content="#0c0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=JetBrains+Mono:wght@700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: a dark after-hours stage. The group chat is the centrepiece; names are covered
   with solid "redaction" bars until the reveal peels them off. */
:root{
  --ink:#0c0e13; --ink-2:#141821; --ink-3:#1c2230; --line:#2b3344;
  --paper:#f4efe4; --mute:#9ba2b3; --hi:#ffd84d; --hi-ink:#1d1700;
  --ok:#3ddc97; --bad:#ff5d6c;
  --display:"Karantina","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --chat:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);background-image:radial-gradient(1100px 540px at 50% -10%,#1b2131 0%,rgba(12,14,19,0) 65%);
     background-attachment:fixed;color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.45;
     -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--hi);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.muted{color:var(--mute)} .small{font-size:.9rem}

.screen{display:none;min-height:100vh;min-height:100dvh;
        padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
        padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.active{display:block}
.wrap{max-width:900px;margin:0 auto}
.wrap.wide{max-width:1440px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:.55em 1.35em;border:0;
     border-radius:999px;background:var(--hi);color:var(--hi-ink);font-weight:800;font-size:1.05rem;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default;transform:none;filter:none}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--mute)}
.btn.small{min-height:40px;font-size:.95rem;padding:.35em 1em}
.btn.big{min-height:62px;font-size:1.35rem;padding:.5em 2em}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px rgba(255,93,108,.45)}
.linkbtn{background:none;border:0;padding:0;color:var(--hi);text-decoration:underline;text-underline-offset:3px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,64px);line-height:.95}

/* the redaction motif */
.redact{position:relative;display:inline-block}
.redact .bar{position:absolute;inset:.1em -.05em .04em;background:var(--paper);border-radius:3px;transform:scaleX(1);
             transition:transform .5s cubic-bezier(.7,0,.2,1)}
[dir=rtl] .redact .bar{transform-origin:right} [dir=ltr] .redact .bar{transform-origin:left}
.logo.open .redact .bar{transform:scaleX(0)}
.logo.open:hover .redact .bar{transform:scaleX(1)}

/* home */
.home{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-top:min(6vh,60px)}
.langbar{display:flex;justify-content:flex-end}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(110px,24vw,280px);line-height:.82;margin:0;letter-spacing:-.005em}
.tagline{font-size:clamp(19px,2.2vw,24px);max-width:36ch;margin:0;color:#d9d4c8;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:22px 24px 24px;border-radius:22px;border:0;
      background:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--paper);transition:transform .15s,box-shadow .15s}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--mute)} .tile:active{transform:scale(.98)}
.tile svg{width:34px;height:34px;margin-bottom:8px}
.tile b{font-family:var(--display);font-weight:700;font-size:clamp(40px,4.6vw,56px);line-height:.9}
.tile span{color:var(--mute)}
.tile.primary{background:var(--hi);color:var(--hi-ink);box-shadow:none}
.tile.primary span{color:#5a4a00}
.guideLink{font-weight:800;font-size:1.1rem}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}

/* setup */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:150px;
      border-radius:22px;border:2px dashed var(--line);padding:24px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--hi);background:rgba(255,216,77,.05)}
.drop strong{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.5vw,48px);line-height:1}
.msg{min-height:1.5em;margin:12px 2px;font-weight:600}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.setupFoot{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-top:18px}
.games{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.gcard{border-radius:22px;background:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.gcard.sel{box-shadow:inset 0 0 0 2px var(--hi)}
.gsum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;width:100%;padding:18px 22px;background:none;border:0;text-align:start}
.gtitle{font-family:var(--display);font-weight:700;font-size:clamp(34px,4vw,46px);line-height:1;flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.gmeta{color:var(--mute);font-variant-numeric:tabular-nums}
.faces{display:flex}
.faces i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem;
         color:#0c0e13;box-shadow:0 0 0 2px var(--ink-2);margin-inline-start:-6px}
.gbody{padding:0 22px 22px;display:flex;flex-direction:column;gap:18px}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;color:var(--mute);font-weight:600;letter-spacing:.02em}
select,.txt{width:100%;min-height:46px;border-radius:12px;border:0;background:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line);padding:8px 12px}
details summary{cursor:pointer;font-weight:700;color:var(--mute)}
.qlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:320px;overflow-y:auto}
.qlist label{display:flex;gap:12px;align-items:baseline;padding:6px 4px;border-radius:8px;cursor:pointer}
.qlist label:hover{background:var(--ink-3)}
.qlist input{accent-color:var(--hi);width:18px;height:18px;flex:none;align-self:center}
.qlist .qd{color:var(--mute);font-variant-numeric:tabular-nums;font-size:.9rem;flex:none}
.qlist .qt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gact .spacer{flex:1}
@media (max-width:640px){.settings{grid-template-columns:1fr}}

/* lobby */
.lobbyMain{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.joinInfo{display:flex;flex-direction:column;gap:2px}
.joinUrl{font-weight:800;font-size:clamp(24px,3vw,36px);direction:ltr;text-align:start;overflow-wrap:anywhere}
[dir=rtl] .joinUrl{text-align:right}
.code{font-family:var(--mono);font-weight:700;font-size:clamp(90px,14vw,200px);line-height:1;letter-spacing:.12em;color:var(--hi);direction:ltr}
[dir=rtl] .code{text-align:right}
.qrBox{background:#fff;padding:14px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#0c0e13;font-weight:800}
.players{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 22px;min-height:56px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;background:var(--ink-2);
      box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:1.25rem;animation:pop .3s ease-out}
[dir=rtl] .chip{padding:6px 14px 6px 8px}
.chip.off{opacity:.45}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0c0e13;flex:none;font-size:1rem}
.kick{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--mute);font-size:.9rem;display:grid;place-items:center}
.kick:hover,.kick:focus-visible{background:var(--bad);color:#fff}
.lobbyFoot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (max-width:760px){.lobbyMain{grid-template-columns:1fr}}

/* game (TV) */
#game{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.timebar{position:fixed;inset:0 0 auto;height:6px;background:var(--ink-3);z-index:20}
.timebar i{display:block;height:100%;width:100%;background:var(--hi);transition:width .2s linear}
.timebar.hurry i{background:var(--bad)}
[dir=rtl] .timebar i{margin-inline-start:0}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 18px}
.ghead .brand{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.ghead .prog{color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.1rem}
.timer{font-family:var(--mono);font-weight:700;font-size:44px;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.timer.hurry{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:28px;align-items:start}
.side{display:flex;flex-direction:column;gap:18px}
.side h2{font-family:var(--display);font-weight:700;font-size:clamp(46px,4.6vw,78px);line-height:.9;margin:0;text-wrap:balance}
.cat{align-self:flex-start;font-weight:700;font-size:.95rem;padding:4px 12px;border-radius:999px;background:var(--ink-3);color:#d9d4c8}
.suspects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sus{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-radius:16px;background:var(--ink-2);
     box-shadow:inset 0 0 0 1.5px var(--line);transition:opacity .4s,transform .4s,box-shadow .4s,background .4s}
.sus .nm{font-weight:800;font-size:1.4rem;min-width:0;overflow-wrap:anywhere;flex:1}
.sus .cnt{font-family:var(--mono);font-weight:700;color:var(--mute)}
.sus .voters{flex-basis:100%;font-size:.9rem;color:var(--mute);min-height:0}
.sus.win{background:var(--ink-3);box-shadow:inset 0 0 0 3px var(--c);transform:scale(1.03)}
@supports (background:color-mix(in srgb,red 10%,blue)){.sus.win{background:color-mix(in srgb,var(--c) 24%,var(--ink-2))}}
.sus.win .cnt{color:var(--paper)}
.sus.dim{opacity:.35}
.locked{display:flex;flex-direction:column;gap:10px}
.locked .lc{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchips span{padding:3px 12px;border-radius:999px;background:var(--ink-3);font-weight:700;font-size:.95rem;animation:pop .25s ease-out}
.board{display:flex;flex-direction:column;gap:6px}
.board h3{margin:0 0 4px;font-size:.9rem;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:var(--ink-2);font-weight:800;font-size:1.2rem}
.row .rk{font-family:var(--mono);color:var(--mute);width:1.6em}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row .plus{font-family:var(--mono);font-size:.9rem;color:var(--ok)}
.row.lead{background:var(--hi);color:var(--hi-ink)} .row.lead .rk,.row.lead .plus{color:#5a4a00}
.sideFoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@media (max-width:980px){.qgrid{grid-template-columns:1fr}}

/* final */
.final{display:flex;flex-direction:column;gap:26px;align-items:stretch;max-width:1100px;margin:0 auto}
.final h2{font-family:var(--display);font-weight:700;font-size:clamp(56px,8vw,120px);line-height:.88;margin:0;text-wrap:balance}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pod .nm{font-weight:800;font-size:clamp(22px,2.6vw,34px);overflow-wrap:anywhere}
.pod .sc{font-family:var(--mono);color:var(--mute)}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;background:var(--ink-3);display:grid;place-items:center;
          font-family:var(--display);font-weight:700;font-size:clamp(60px,8vw,110px);line-height:1;color:var(--mute)}
.pod.p1 .blk{height:220px;background:var(--hi);color:var(--hi-ink)} .pod.p2 .blk{height:160px} .pod.p3 .blk{height:120px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fact{padding:18px 20px;border-radius:18px;background:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:4px}
.fact .k{font-size:.85rem;letter-spacing:.06em;color:var(--mute);font-weight:700;text-transform:uppercase}
.fact .v{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.fact .s{color:var(--mute)}

/* chat panel (WhatsApp-like) */
.wa{background:#0b141a;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--chat);
    box-shadow:0 30px 80px rgba(0,0,0,.45);color:#e9edef}
.wa-head{background:#202c33;padding:11px 16px;display:flex;gap:12px;align-items:center}
.wa-gav{width:42px;height:42px;border-radius:50%;background:#6b7c85;display:grid;place-items:center;flex:none}
.wa-gname{font-weight:600;font-size:1.15rem}
.wa-sub{font-size:.85rem;color:#8696a0}

.wa-date,.wa-sys{align-self:center;border-radius:8px;text-align:center;margin-bottom:6px}
.wa-date{background:#182229;color:#8696a0;font-size:.85rem;padding:4px 12px}
.wa-sys{max-width:90%;background:#2a2617;color:#ffd279;font-size:1rem;padding:6px 14px;white-space:pre-line}
.b{position:relative;max-width:82%;align-self:flex-start;padding:6px 10px 7px;border-radius:9px;background:#202c33;
   font-size:1.35rem;line-height:1.38;white-space:pre-line;overflow-wrap:anywhere}
.b.first{margin-top:7px;border-start-start-radius:0}
.b.out{align-self:flex-end;background:#005c4b}
.b.out.first{border-start-start-radius:9px;border-start-end-radius:0}
.b .nm{position:relative;display:block;width:fit-content;font-size:.9rem;font-weight:700;margin-bottom:1px;min-height:1.15em}
.b .rb{display:inline-block;height:.82em;vertical-align:-.04em;background:#d6dade;border-radius:2px}
.b .nm .cover{position:absolute;inset:.08em -2px .02em;background:#d6dade;border-radius:2px;animation:peel .55s cubic-bezier(.7,0,.2,1) both}
[dir=rtl] .b .nm .cover{transform-origin:right} [dir=ltr] .b .nm .cover{transform-origin:left}
@keyframes peel{to{transform:scaleX(0)}}
.b .tm{font-size:.72rem;color:#8696a0;margin-top:8px;margin-inline-start:14px;float:left}
[dir=ltr] .b .tm{float:right}
.b.out .tm{color:#a3d4c8}
.b.target{box-shadow:0 0 0 3px var(--hi),0 0 26px rgba(255,216,77,.35)}
.b.react{animation:rise .45s ease-out both}
.ask{align-self:flex-start;color:var(--hi);font-family:var(--body);font-weight:800;font-size:1.05rem;margin:10px 2px 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wa.sm{border-radius:14px}
.wa.sm .wa-body{max-height:40vh;padding:10px 12px 12px;background-size:180px auto}
.wa.sm .b{font-size:1.02rem}
.wa.sm .b .nm{font-size:.8rem}
.wa.sm .wa-sys{font-size:.85rem}

/* phone */
#player{padding:0}
.pbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
      background:var(--ink-2);font-weight:800}
.pbar .sc{font-family:var(--mono);color:var(--hi)}
.pview{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pq{display:flex;flex-direction:column;gap:12px}
.pq .lbl{font-weight:800;font-size:1.05rem;color:var(--hi)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:66px;border:0;border-radius:16px;background:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);
     display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:800;font-size:1.15rem;text-align:start}
.opt:active{transform:scale(.97)}
.opt .nm{min-width:0;overflow-wrap:anywhere}
.state{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.state .big{font-family:var(--display);font-weight:700;font-size:clamp(64px,20vw,110px);line-height:.85;margin:0}
.state .pts{font-family:var(--mono);font-size:2rem}
.state.ok{background:linear-gradient(180deg,rgba(61,220,151,.18),rgba(61,220,151,0));border-radius:24px}
.state.bad{background:linear-gradient(180deg,rgba(255,93,108,.16),rgba(255,93,108,0));border-radius:24px}
.joinForm{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:4vh}
.joinForm h2{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;margin:0}
.joinForm label{font-size:.9rem;color:var(--mute);font-weight:600}
.joinForm .txt{min-height:58px;font-size:1.4rem;text-align:center}
#codeInput{font-family:var(--mono);letter-spacing:.3em}

/* floating host controls */
#playersBtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:30}
#playersPanel{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));
              width:min(380px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:var(--ink-2);border-radius:18px;padding:12px;
              z-index:30;box-shadow:0 14px 50px rgba(0,0,0,.55),inset 0 0 0 1.5px var(--line)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none} .dot.off{background:var(--mute)}
#previewBar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));
            z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#previewBar .tag{background:var(--ink-3);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
       background:var(--paper);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:999px;max-width:calc(100vw - 32px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ================= Home ================= -->
<section class="screen active" id="home">
  <div class="home">
    <div class="langbar"><button class="btn ghost small" onclick="toggleLang()" data-t="langSwitch">English</button></div>
    <h1 class="logo" id="logo"><span data-t="logoA">מי </span><span class="redact"><span data-t="logoB">שלח</span><i class="bar"></i></span><span data-t="logoC">?</span></h1>
    <p class="tagline" data-t="tagline"></p>
    <div class="tiles">
      <button class="tile primary" onclick="goSetup()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
        <b data-t="hostTitle"></b><span data-t="hostSub"></span>
      </button>
      <button class="tile" onclick="show('join')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>
        <b data-t="joinTitle"></b><span data-t="joinSub"></span>
      </button>
    </div>
    <div id="rejoinBox" hidden><button class="btn" id="rejoinBtn" onclick="rejoin()"></button></div>
    <a class="guideLink" href="guide.html" data-t="howTo"></a>
  </div>
</section>

<!-- ================= TV: choose a game ================= -->
<section class="screen" id="setup">
  <div class="wrap">
    <div class="topbar">
      <button class="btn ghost small back" onclick="history.back()" data-t="back"></button>
      <h2 data-t="setupTitle"></h2>
    </div>
    <label class="drop" id="drop" for="fileInput">
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <strong data-t="dropTitle"></strong>
      <span class="muted" data-t="dropSub"></span>
    </label>
    <div id="loadMsg" class="msg" role="status" aria-live="polite"></div>
    <div id="gamesList" class="games"></div>
    <div class="setupFoot small">
      <a href="guide.html" data-t="noFile"></a>
      <button class="linkbtn" onclick="loadSample()" data-t="trySample"></button>
      <span class="muted" data-t="privacy"></span>
    </div>
  </div>
</section>

<!-- ================= TV: lobby ================= -->
<section class="screen" id="lobby">
  <div class="wrap wide">
    <div class="topbar">
      <button class="btn ghost small back" onclick="history.back()" data-t="back"></button>
      <span class="muted" id="lobbyTitle" dir="auto"></span>
    </div>
    <div class="lobbyMain">
      <div class="joinInfo">
        <span class="muted" data-t="joinAt"></span>
        <span class="joinUrl" id="joinUrl"></span>
        <span class="muted" data-t="andCode"></span>
        <span class="code" id="roomCode">····</span>
        <span class="muted small" id="hostStatus"></span>
      </div>
      <div class="qrBox"><div id="qr"></div><span data-t="orScan"></span></div>
    </div>
    <div id="players" class="players"></div>
    <div class="lobbyFoot">
      <span class="muted" id="count"></span>
      <button class="btn big" id="startBtn" onclick="startGame()" disabled data-primary data-t="start"></button>
    </div>
  </div>
</section>

<!-- ================= TV: game ================= -->
<section class="screen" id="game">
  <div class="timebar" id="timebar"><i id="timeFill"></i></div>
  <div class="wrap wide">
    <header class="ghead">
      <span class="brand" data-t="docTitle"></span>
      <span class="prog" id="prog"></span>
      <span class="timer" id="timer"></span>
    </header>
    <div id="stage"></div>
  </div>
</section>

<!-- ================= Phone: join ================= -->
<section class="screen" id="join">
  <div class="joinForm">
    <div><button class="btn ghost small back" onclick="history.back()" data-t="back"></button></div>
    <h2 data-t="joinHeading"></h2>
    <label for="codeInput" data-t="codePh"></label>
    <input class="txt" id="codeInput" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="1234">
    <label for="nameInput" data-t="namePh"></label>
    <input class="txt" id="nameInput" maxlength="16" autocomplete="nickname" dir="auto">
    <button class="btn big" id="joinBtn" onclick="joinRoom()" data-t="joinBtn"></button>
    <div id="status" class="msg" role="status" aria-live="polite"></div>
  </div>
</section>

<!-- ================= Phone: in game ================= -->
<section class="screen" id="player">
  <div class="pbar"><span id="pName" dir="auto"></span><span class="sc" id="pScore">0</span></div>
  <div class="pview" id="pview"></div>
</section>

/* =========================================================
   screens + browser Back
   ========================================================= */
let current = 'home';
function show(id, push = true) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  if (push && id !== current) { try { history.pushState({ screen: id }, '', '#' + id); } catch (e) {} }
  current = id;
  window.scrollTo(0, 0);
}
function replaceScreen(id) { try { history.replaceState({ screen: id }, '', '#' + id); } catch (e) {} }
window.addEventListener('popstate', e => {
  let target = (e.state && e.state.screen) || 'home';
  const stay = () => { try { history.pushState({ screen: current }, '', '#' + current); } catch (err) {} };
  if (current === 'lobby' || current === 'game') {
    const mid = roomActive && !previewMode && (phase === 'question' || phase === 'reveal');
    if (mid && !confirm(t('leaveConfirm'))) { stay(); return; }
    closeRoom();
    target = 'setup'; replaceScreen('setup');
  } else if (current === 'player') {
    if (!kicked && myConn && !confirm(t('leaveGame'))) { stay(); return; }
    leaveAsPlayer();
    target = 'home'; replaceScreen('home');
  }
  if ((target === 'lobby' || target === 'game') && !roomActive) { target = 'setup'; replaceScreen('setup'); }
  if (target === 'player' && !myConn) { target = 'home'; replaceScreen('home'); }
  if (target === 'setup') renderGames();
  if (target === 'home') showRejoinBanner();
  show(target, false);
});

/* =========================================================
   game files
   Format: { title, group, me, participants:[{name,color}],
             questions:[{ date, category, note, time, messages:[{from,text,time,answer,reaction}] }] }
   Also reads the older party-quiz files (questions with chat.lines).
   ========================================================= */
const PALETTE = ['#53bdeb', '#ffbc38', '#06cf9c', '#fc9775', '#e542a3', '#a5b337', '#9b8cff', '#ff7a59', '#00a5f4', '#d3b56b', '#25d366', '#ff5d8f'];
function normalizeGame(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error(t('errNotGame'));
  const qs = Array.isArray(raw.questions) ? raw.questions : null;
  if (!qs || !qs.length) throw new Error(t('errNoQuestions'));
  const names = [], colorOf = {};
  const addName = n => { n = String(n ?? '').trim().slice(0, 30); if (n && !names.includes(n)) names.push(n); return n; };
  if (Array.isArray(raw.participants)) raw.participants.forEach(p => {
    const n = addName(typeof p === 'string' ? p : p && p.name);
    if (n && p && okColor(p.color)) colorOf[n] = p.color;
  });
  const out = []; let skipped = 0;
  qs.slice(0, 500).forEach(q => {
    try {
      if (!q || typeof q !== 'object') throw 0;
      let msgs, date, note, cat, time;
      if (q.chat && Array.isArray(q.chat.lines)) {           // older party-quiz file
        msgs = q.chat.lines.map(l => ({ from: l.who, text: l.text, time: l.time, answer: l.target, reaction: l.react }));
        date = q.chat.date; note = q.chat.note; cat = q.cat; time = q.time;
        if (Array.isArray(q.a)) q.a.forEach(addName);
      } else { msgs = q.messages; date = q.date; note = q.note; cat = q.category; time = q.time; }
      if (!Array.isArray(msgs) || !msgs.length) throw 0;
      msgs = msgs.slice(0, 40).map(m => ({
        from: addName(m && m.from), text: String((m && m.text) ?? '').slice(0, 3000), time: String((m && m.time) || '').slice(0, 8),
        answer: !!(m && m.answer), reaction: !!(m && m.reaction && !m.answer)
      }));
      const ans = msgs.filter(m => m.answer);
      if (!ans.length || !ans[0].from || !ans.every(m => m.from === ans[0].from)) throw 0;
      const tm = Number(time);
      out.push({ id: out.length, date: String(date || '').slice(0, 20), note: note ? String(note).slice(0, 240) : '',
        category: cat ? String(cat).slice(0, 40) : '', time: Number.isFinite(tm) && tm >= 5 && tm <= 180 ? Math.round(tm) : 0,
        messages: msgs, sender: ans[0].from });
    } catch (e) { skipped++; }
  });
  if (!out.length) throw new Error(t('errNoValid'));
  return {
    title: String(raw.title || raw.group || t('untitled')).slice(0, 60),
    group: String(raw.group || raw.title || t('untitled')).slice(0, 60),
    me: String(raw.me || '').trim(),
    participants: names.map((n, i) => ({ name: n, color: colorOf[n] || PALETTE[i % PALETTE.length] })),
    questions: out, skipped
  };
}

/* saved games (this browser only) */
const GAMES_KEY = 'wst.games';
let games = [], canSave = true, selectedId = null;
try { const a = JSON.parse(lsGet(GAMES_KEY)); if (Array.isArray(a)) games = a.filter(r => r && r.game && Array.isArray(r.game.questions)); } catch (e) {}
function saveGames() { canSave = lsSet(GAMES_KEY, JSON.stringify(games.filter(r => !r.sample))); return canSave; }
function currentRec() { return games.find(r => r.id === selectedId) || null; }
function addGame(raw, sample) {
  const g = normalizeGame(raw);
  const rec = { id: newId(), addedAt: Date.now(), game: g, off: [], sample: !!sample,
    settings: { count: 'all', order: 'shuffle', pace: 'normal' } };
  games = games.filter(r => !(sample && r.sample));
  games.unshift(rec); selectedId = rec.id;
  if (!sample) saveGames();
  return rec;
}
function setMsg(text, kind) { const el = $('loadMsg'); el.textContent = text || ''; el.className = 'msg' + (kind ? ' ' + kind : ''); }
function readFile(file) {
  if (!file) return;
  if (file.size > 8e6) { setMsg(t('errBig'), 'err'); return; }
  const r = new FileReader();
  r.onload = () => {
    let raw;
    try { raw = JSON.parse(String(r.result).replace(/^﻿/, '')); } catch (e) { setMsg(t('errRead'), 'err'); return; }
    try {
      const rec = addGame(raw);
      setMsg(t('loaded', { t: rec.game.title }) + (rec.game.skipped ? t('skipped', { n: rec.game.skipped }) : ''), 'ok');
      if (!canSave) setMsg(t('notSaved'), 'err');
      renderGames();
    } catch (e) { setMsg(e.message || t('errRead'), 'err'); }
  };
  r.onerror = () => setMsg(t('errRead'), 'err');
  r.readAsText(file);
}
function loadSample() {
  addGame(LANG === 'he' ? SAMPLE_HE : SAMPLE_EN, true);
  setMsg('', ''); renderGames();
}
function selectGame(id) { selectedId = selectedId === id ? null : id; renderGames(); }
function deleteGame(id) {
  const rec = games.find(r => r.id === id);
  if (!rec || !confirm(t('delConfirm', { t: rec.game.title }))) return;
  games = games.filter(r => r.id !== id); if (selectedId === id) selectedId = null;
  saveGames(); renderGames();
}
function setSetting(key, val) { const rec = currentRec(); if (!rec) return; rec.settings[key] = val; if (!rec.sample) saveGames(); }
function toggleQ(qid, on) {
  const rec = currentRec(); if (!rec) return;
  const off = new Set(rec.off || []); on ? off.delete(qid) : off.add(qid); rec.off = [...off];
  if (!rec.sample) saveGames();
  const sum = $('qsum'); if (sum) sum.textContent = t('questionsList', { a: rec.game.questions.length - off.size, n: rec.game.questions.length });
}
function renderGames() {
  const box = $('gamesList');
  if (!games.length) { box.innerHTML = ''; return; }
  if (!selectedId) selectedId = games[0].id;
  box.innerHTML = games.map(rec => {
    const g = rec.game, sel = rec.id === selectedId, off = new Set(rec.off || []), s = rec.settings;
    const active = g.questions.length - off.size;
    const faces = g.participants.slice(0, 10).map(p => `<i style="background:${p.color}">${esc(initial(p.name))}</i>`).join('');
    let body = '';
    if (sel) {
      const counts = [10, 15, 20, 30].filter(n => n < active);
      const opt = (v, label, cur) => `<option value="${v}"${String(cur) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
      body = `<div class="gbody">
        <div class="settings">
          <div class="field"><label for="set-count">${esc(t('settingCount'))}</label>
            <select id="set-count" onchange="setSetting('count',this.value)">${opt('all', t('all', { n: active }), s.count)}${counts.map(n => opt(n, n, s.count)).join('')}</select></div>
          <div class="field"><label for="set-order">${esc(t('settingOrder'))}</label>
            <select id="set-order" onchange="setSetting('order',this.value)">${opt('shuffle', t('orderShuffle'), s.order)}${opt('date', t('orderDate'), s.order)}</select></div>
          <div class="field"><label for="set-pace">${esc(t('settingPace'))}</label>
            <select id="set-pace" onchange="setSetting('pace',this.value)">${opt('relaxed', t('paceRelaxed'), s.pace)}${opt('normal', t('paceNormal'), s.pace)}${opt('fast', t('paceFast'), s.pace)}</select></div>
        </div>
        <details><summary id="qsum">${esc(t('questionsList', { a: active, n: g.questions.length }))}</summary>
          <ol class="qlist">${g.questions.map(q => {
            const a = q.messages.find(m => m.answer);
            return `<li><label><input type="checkbox" id="q-${q.id}"${off.has(q.id) ? '' : ' checked'} onchange="toggleQ(${q.id},this.checked)">
              <span class="qd">${esc(q.date)}</span><span class="qt" dir="auto">${esc(a.text.replace(/\s+/g, ' '))}</span></label></li>`;
          }).join('')}</ol></details>
        <div class="gact">
          <button class="btn big" data-primary onclick="openRoom()"${active ? '' : ' disabled'}>${esc(t('openRoom'))}</button>
          <button class="btn ghost" onclick="startPreview()"${active ? '' : ' disabled'}>${esc(t('preview'))}</button>
          <span class="spacer"></span>
          ${rec.sample ? '' : `<button class="btn danger small" onclick="deleteGame('${rec.id}')">${esc(t('del'))}</button>`}
        </div></div>`;
    }
    return `<article class="gcard${sel ? ' sel' : ''}">
      <button class="gsum" onclick="selectGame('${rec.id}')" aria-expanded="${sel}">
        <span class="gtitle" dir="auto">${esc(g.title)}</span>
        <span class="gmeta">${esc(t('metaQ', { n: active }))} · ${esc(t('metaP', { n: g.participants.length }))}</span>
        <span class="faces" aria-hidden="true">${faces}</span>
      </button>${body}</article>`;

function goSetup() { renderGames(); show('setup'); }

/* =========================================================
   building a round
   ========================================================= */
let ROUND = null;   // { game, items:[{ q, options:[{name,color}], correct, dur }] }
function autoTime(q) {
  if (q.time) return q.time;
  const chars = q.messages.filter(m => !m.reaction).reduce((s, m) => s + m.text.length, 0);
  return clamp(Math.round((12 + chars / 30) / 5) * 5, 15, 60);
}
function optionsFor(q, g) {
  const ps = g.participants;
  let list = ps;
  if (ps.length > 8) {
    const others = shuffle(ps.filter(p => p.name !== q.sender)).slice(0, 5);
    const keep = new Set([q.sender, ...others.map(p => p.name)]);
    list = ps.filter(p => keep.has(p.name));
  }
  return list.map(p => ({ name: p.name, color: p.color }));
}
function prepareRound(rec) {
  const g = rec.game, s = rec.settings || {}, off = new Set(rec.off || []);
  let qs = shuffle(g.questions.filter(q => !off.has(q.id)));
  if (s.count && s.count !== 'all') qs = qs.slice(0, Number(s.count));
  if (s.order === 'date') qs.sort((a, b) => a.id - b.id);
  const pace = { relaxed: 1.4, normal: 1, fast: 0.7 }[s.pace] || 1;
  ROUND = { game: g, colors: Object.fromEntries(g.participants.map(p => [p.name, p.color])),
    items: qs.map(q => { const options = optionsFor(q, g);
      return { q, options, correct: options.findIndex(o => o.name === q.sender), dur: Math.max(8, Math.round(autoTime(q) * pace)) }; }) };
}

/* =========================================================
   the chat panel
   lines: [{ from?, text, time, answer, reaction, first? }]
   Before the reveal names are solid bars (their width does not depend on the name).
   ========================================================= */
const BAR_W = [3.4, 4.6, 2.8, 3.9, 5.1, 3.1, 4.2];
const GROUP_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 13.6c2.9.2 5 2.2 5 5.4"></path></svg>';
function hiddenLines(q) {   // what phones get: no names, no reactions, only where a new sender starts
  const vis = q.messages.filter(m => !m.reaction);
  return vis.map((m, i) => ({ text: m.text, time: m.time, answer: m.answer, first: i === 0 || vis[i - 1].from !== m.from }));
}
function chatHtml(c, o = {}) {
  const reveal = !!o.reveal;
  const lines = reveal ? c.lines : c.lines.filter(l => !l.reaction);
  let run = -1, asked = false, ri = 0;
  const body = lines.map((l, i) => {
    const first = reveal ? (i === 0 || lines[i - 1].from !== l.from) : (l.first !== undefined ? l.first : true);
    if (first) run++;
    const out = reveal && o.me && l.from === o.me;
    let nm = '';
    if (first && !out) {
      if (reveal) {
        const col = (o.colors && o.colors[l.from]) || '#8696a0';
        nm = `<span class="nm" style="color:${col}" dir="auto">${esc(l.from)}<i class="cover" style="animation-delay:${Math.min(run * 110, 1100)}ms"></i></span>`;
      } else nm = `<span class="nm"><i class="rb" style="width:${BAR_W[run % BAR_W.length]}em"></i></span>`;
    }
    const ask = (!reveal && l.answer && !asked) ? (asked = true, `<div class="ask">${esc(t('whoSent'))}</div>`) : '';
    const cls = ['b', out ? 'out' : '', first ? 'first' : '', l.answer ? 'target' : '', l.reaction ? 'react' : ''].join(' ');
    const delay = l.reaction ? ` style="animation-delay:${900 + (ri++) * 450}ms"` : '';
    return `${ask}<div class="${cls}"${delay}>${nm}<span dir="auto">${esc(l.text)}</span><span class="tm">${esc(l.time || '')}</span></div>`;
  }).join('');
  const head = o.small ? '' : `<div class="wa-head"><span class="wa-gav">${GROUP_ICON}</span><div>
      <div class="wa-gname" dir="auto">${esc(c.group || '')}</div>
      <div class="wa-sub">${reveal ? esc((o.names || []).join(', ')) : esc(t('namesHidden'))}</div></div></div>`;
  return `<div class="wa${o.small ? ' sm' : ''}">${head}<div class="wa-body">
      ${c.date ? `<div class="wa-date">${esc(c.date)}</div>` : ''}
      ${c.note ? `<div class="wa-sys" dir="auto">${esc(c.note)}</div>` : ''}${body}</div></div>`;
}

/* =========================================================
   HOST (TV)
   ========================================================= */
const PREFIX = 'whosent-v1-';
const players = new Map();      // key -> { name, token, conn, connected, score, answer, elapsed, lastPoints, hits:[] }
const banned = new Set(), bannedTokens = new Set();
let peer = null, roomActive = false, previewMode = false, phase = 'idle';
let qIndex = -1, qStart = 0, qDur = 20, timerId = null, senderStats = {};

function openRoom() {
  const rec = currentRec(); if (!rec) return;
  prepareRound(rec);
  if (!ROUND.items.length) return;
  closeRoom();
  roomActive = true; phase = 'lobby';
  $('lobbyTitle').textContent = rec.game.title;
  $('joinUrl').textContent = (location.host + location.pathname).replace(/index\.html$/, '').replace(/\/$/, '');
  $('roomCode').textContent = '····'; $('qr').innerHTML = '';
  $('hostStatus').textContent = t('creating');
  show('lobby'); renderLobby(); createPeer();
}
function createPeer() {
  if (typeof Peer === 'undefined') { $('hostStatus').textContent = t('noPeer'); return; }
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const p = new Peer(PREFIX + code);
  peer = p;
  p.on('open', () => {
    if (peer !== p) return;
    $('roomCode').textContent = code;
    $('hostStatus').textContent = t('roomOpen');
    const url = location.origin + location.pathname + '?join=' + code;
    $('qr').innerHTML = '';
    if (typeof QRCode !== 'undefined') new QRCode($('qr'), { text: url, width: 180, height: 180, colorDark: '#0c0e13', colorLight: '#ffffff' });
  });
  p.on('error', err => {
    if (peer !== p) return;
    if (err.type === 'unavailable-id') { p.destroy(); createPeer(); }
    else if (err.type !== 'peer-unavailable') $('hostStatus').textContent = t('roomErr', { e: err.type });
  });
  p.on('disconnected', () => { if (peer === p && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
  p.on('connection', handleConnection);
}
function closeRoom() {
  clearInterval(timerId);
  players.forEach(pl => { try { pl.conn && pl.conn.close(); } catch (e) {} });
  if (peer) { const p = peer; peer = null; try { p.destroy(); } catch (e) {} }
  players.clear(); banned.clear(); bannedTokens.clear();
  roomActive = false; previewMode = false; phase = 'idle';
  $('playersBtn').hidden = true; $('playersPanel').hidden = true; $('previewBar').hidden = true;
}

function handleConnection(conn) {
  conn.on('data', msg => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'join') {
      const name = String(msg.name || '').trim().slice(0, 16);
      const key = name.toLowerCase();
      const token = String(msg.token || '').slice(0, 40);
      if (!name) return;
      if (banned.has(key) || (token && bannedTokens.has(token))) { conn.send({ type: 'kicked' }); return; }
      const existing = players.get(key);
      if (existing && existing.connected && existing.token !== token) { conn.send({ type: 'error', code: 'taken' }); return; }
      const p = existing || { name, score: 0, answer: null, elapsed: 0, lastPoints: 0, hits: [] };
      const old = p.conn;
      p.conn = conn; p.connected = true; p.token = token; conn._key = key;
      players.set(key, p);
      if (old && old !== conn) { try { old.close(); } catch (e) {} }
      conn.send({ type: 'welcome', name: p.name, score: p.score });
      syncPlayer(p);
      refreshHost();
    } else if (msg.type === 'answer') {
      const p = players.get(conn._key);
      if (p && p.conn === conn) onAnswer(p, msg.choice);
    }
  });
  conn.on('close', () => {
    const p = players.get(conn._key);
    if (!p || p.conn !== conn) return;
    p.connected = false;
    if (phase === 'lobby') players.delete(conn._key);
    refreshHost(); maybeEndEarly();
  });
}
function send(p, msg) { if (p.connected && p.conn && p.conn.open) { try { p.conn.send(msg); } catch (e) {} } }
function broadcast(msg) { players.forEach(p => send(p, msg)); }
function connectedPlayers() { return [...players.values()].filter(p => p.connected); }
function ranking() { return [...players.values()].sort((a, b) => b.score - a.score); }
function syncPlayer(p) {
  if (phase === 'lobby') send(p, { type: 'lobby' });
  else if (phase === 'question') send(p, p.answer === null ? questionMsg() : { type: 'locked', choice: ROUND.items[qIndex].options[p.answer] });
  else if (phase === 'final') { const r = ranking(); send(p, { type: 'final', rank: r.indexOf(p) + 1, of: r.length, score: p.score }); }
  else send(p, p.lastResult || { type: 'between' });
}
function refreshHost() {
  if (phase === 'lobby') renderLobby();
  if (phase === 'question') renderLocked();
  renderPlayersPanel();
}
function renderLobby() {
  const box = $('players'); box.innerHTML = '';
  players.forEach((p, key) => {
    const chip = document.createElement('div'); chip.className = 'chip' + (p.connected ? '' : ' off');
    const av = document.createElement('span'); av.className = 'av'; av.style.background = PALETTE[[...key].reduce((s, c) => s + c.charCodeAt(0), 0) % PALETTE.length]; av.textContent = initial(p.name);
    const nm = document.createElement('span'); nm.textContent = p.name; nm.dir = 'auto';
    const b = document.createElement('button'); b.className = 'kick'; b.textContent = '✕';
    b.setAttribute('aria-label', t('removeAria', { n: p.name })); b.onclick = () => kick(key);
    chip.append(av, nm, b); box.appendChild(chip);
  });
  const n = connectedPlayers().length;
  $('count').textContent = n ? t('nPlayers', { n }) : t('waiting');
  $('startBtn').disabled = n === 0;
}

/* host controls */
function kick(key) {
  const p = players.get(key);
  if (!p || !confirm(t('removeConfirm', { n: p.name }))) return;
  banned.add(key); if (p.token) bannedTokens.add(p.token);
  send(p, { type: 'kicked' });
  const c = p.conn; setTimeout(() => { try { c && c.close(); } catch (e) {} }, 300);
  players.delete(key);

function togglePlayers() { const pn = $('playersPanel'); pn.hidden = !pn.hidden; renderPlayersPanel(); }
function renderPlayersPanel() {
  const pn = $('playersPanel'); if (pn.hidden) return;
  pn.innerHTML = '';
  if (!players.size) { pn.textContent = t('noPlayers'); return; }
  players.forEach((p, key) => {
    const row = document.createElement('div'); row.className = 'prow';
    const dot = document.createElement('span'); dot.className = 'dot' + (p.connected ? '' : ' off');
    const nm = document.createElement('span'); nm.className = 'nm'; nm.dir = 'auto'; nm.textContent = p.name;
    const sc = document.createElement('span'); sc.className = 'muted'; sc.textContent = p.connected ? p.score : p.score + ' · ' + t('offline');
    const b = document.createElement('button'); b.className = 'kick'; b.textContent = '✕';

/* game flow */
function startGame() {
  players.forEach((p, key) => { if (!p.connected) players.delete(key); });
  players.forEach(p => { p.score = 0; p.hits = []; });
  senderStats = {}; qIndex = -1;
  show('game');
  $('playersBtn').hidden = false;
  nextQuestion();
}
function questionMsg() {
  const it = ROUND.items[qIndex], q = it.q;

}
function nextQuestion() {
  qIndex++;

  phase = 'question';
  players.forEach(p => { p.answer = null; p.lastPoints = 0; p.elapsed = 0; p.lastResult = null; });
  const it = ROUND.items[qIndex], q = it.q, g = ROUND.game;
  qDur = it.dur;
  $('prog').textContent = t('qOf', { i: qIndex + 1, n: ROUND.items.length });
  $('stage').innerHTML = `<div class="qgrid">
      <div id="chatBox">${chatHtml({ group: g.group, date: q.date, note: q.note, lines: hiddenLines(q) })}</div>
      <aside class="side">
        ${q.category ? `<span class="cat" dir="auto">${esc(q.category)}</span>` : ''}
        <h2>${esc(t('whoSentMarked'))}</h2>
        <div class="suspects">${it.options.map((o, i) => `<div class="sus" id="sus${i}" style="--c:${o.color}">
            <span class="av" style="background:${o.color}">${esc(initial(o.name))}</span><span class="nm" dir="auto">${esc(o.name)}</span>
            <span class="cnt" id="cnt${i}"></span><span class="voters" id="vot${i}"></span></div>`).join('')}</div>
        <div class="locked"><span class="lc" id="lockedCount"></span><div class="lchips" id="lockedChips"></div></div>
        <div class="sideFoot" id="sideFoot"><button class="btn ghost small" onclick="endQuestion()">${esc(t('revealNow'))}</button></div>
      </aside></div>`;
  renderLocked();
  qStart = performance.now();
  broadcast(questionMsg());
  if (previewMode) setTimeout(() => { if (phase === 'question') fakeAnswers(); }, 1800);
  clearInterval(timerId);
  tick(); timerId = setInterval(tick, 200);
}
function tick() {
  const left = Math.max(0, qDur - (performance.now() - qStart) / 1000);
  $('timer').textContent = Math.ceil(left);
  $('timeFill').style.width = (left / qDur * 100) + '%';
  const hurry = left <= 5;

}
function renderLocked() {
  const all = [...players.values()].filter(p => p.connected || p.answer !== null);
  const done = all.filter(p => p.answer !== null);
  const lc = $('lockedCount'); if (!lc) return;
  lc.textContent = t('lockedN', { a: done.length, n: all.length });
  $('lockedChips').innerHTML = done.map(p => `<span dir="auto">${esc(p.name)}</span>`).join('');
}
function onAnswer(p, choice) {

  const it = ROUND.items[qIndex];
  if (!Number.isInteger(choice) || choice < 0 || choice >= it.options.length) return;
  p.answer = choice;
  p.elapsed = (performance.now() - qStart) / 1000;   // measured on the TV, so phone clocks don't matter
  send(p, { type: 'locked', choice: it.options[choice] });
  renderLocked(); maybeEndEarly();
}
function maybeEndEarly() {
  if (phase !== 'question') return;
  const online = connectedPlayers();
  if (online.length && online.every(x => x.answer !== null)) setTimeout(() => endQuestion(), 600);
}
function endQuestion() {
  if (phase !== 'question') return;
  phase = 'reveal';
  clearInterval(timerId);
  $('timer').textContent = ''; $('timeFill').style.width = '0%';
  const it = ROUND.items[qIndex], q = it.q, g = ROUND.game;
  const st = senderStats[q.sender] || (senderStats[q.sender] = { answers: 0, right: 0 });
  players.forEach(p => {
    const right = p.answer === it.correct;
    p.lastPoints = right ? Math.round(1000 * (1 - 0.5 * Math.min(1, p.elapsed / qDur))) : 0;
    p.score += p.lastPoints;
    if (p.answer !== null) { st.answers++; if (right) { st.right++; p.hits.push(p.elapsed); } }
  });
  const ranked = ranking();
  ranked.forEach((p, i) => send(p, p.lastResult = { type: 'result', answered: p.answer !== null, correct: p.answer === it.correct, points: p.lastPoints,
    score: p.score, rank: i + 1, of: ranked.length, sender: { name: q.sender, color: (ROUND.colors[q.sender] || '#8696a0') } }));
  // chat with names, reactions, and the votes per suspect

    { reveal: true, me: g.me, colors: ROUND.colors, names: g.participants.map(p => p.name) });
  it.options.forEach((o, i) => {
    const voters = [...players.values()].filter(p => p.answer === i);
    const el = $('sus' + i);
    el.classList.add(i === it.correct ? 'win' : 'dim');
    $('cnt' + i).textContent = voters.length || '';
    $('vot' + i).textContent = voters.map(p => p.name).join(', ');
  });

  const verdict = players.size ? (rightN === 0 ? t('nobody') : rightN === players.size ? t('everybody') : '') : '';
  $('lockedCount').textContent = verdict; $('lockedChips').innerHTML = '';
  $('sideFoot').innerHTML = `<div class="board" style="flex:1">
      <h3>${esc(t('board'))}</h3>
      ${ranked.slice(0, 5).map((p, i) => `<div class="row${i === 0 && p.score > 0 ? ' lead' : ''}"><span class="rk">${i + 1}</span>
        <span class="nm" dir="auto">${esc(p.name)}</span>${p.lastPoints ? `<span class="plus">+${p.lastPoints}</span>` : ''}<span class="sc">${p.score}</span></div>`).join('')}

function showFinal() {

  const r = ranking();
  r.forEach((p, i) => send(p, { type: 'final', rank: i + 1, of: r.length, score: p.score }));
  const pod = (p, place) => p ? `<div class="pod p${place}"><span class="nm" dir="auto">${esc(p.name)}</span><span class="sc">${p.score}</span><div class="blk">${place}</div></div>` : '<div></div>';

  if (fast) facts.push({ k: t('fastest'), v: fast.n, s: t('fastestSub', { s: fast.s.toFixed(1) }) });
  $('stage').innerHTML = `<div class="final">

      ${facts.length ? `<div class="facts">${facts.map(f => `<div class="fact"><span class="k">${esc(f.k)}</span><span class="v" dir="auto">${esc(f.v)}</span><span class="s">${esc(f.s)}</span></div>`).join('')}</div>` : ''}
      <div class="gact"><button class="btn big" data-primary onclick="playAgain()">${esc(t('playAgain'))}</button>

}
function playAgain() {

let myConn = null, myPeer = null, session = null, kicked = false, retries = 0, retryTimer = null, lastQ = null;

    if (fromForm && !myConn) {
      const st = $('status'); st.className = 'msg err'; st.textContent = text;
      $('joinBtn').disabled = false; try { peerP.destroy(); } catch (e) {}
    } else lost(roomGone ? t('roomClosed') : text, roomGone);
  };
  peerP.on('open', () => {
    const conn = peerP.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => conn.send({ type: 'join', name, token: deviceToken() }));
    conn.on('data', msg => onHostMessage(msg, conn, fail, code));
    conn.on('close', () => { if (myConn === conn) lost(); });
  });
  peerP.on('error', err => fail(err.type === 'peer-unavailable' ? t('roomNotFound') : t('connProblem', { e: err.type }), err.type === 'peer-unavailable'));
}
function lost(reason, stop) {
  if (kicked || !session) return;
  myConn = null;
  if (stop || retries >= MAX_RETRIES) {
    pview(`<p class="big">${esc(reason || t('disconnected'))}</p><p class="muted">${esc(t('scoreKept'))}</p>
      <button class="btn big" onclick="rejoin()">${esc(t('rejoinAs', { n: session.name }))}</button>`, 'bad');
    return;
  }
  retries++;
  pview(`<p class="big">${esc(t('reconnecting'))}</p><p class="muted">${esc(t('tryN', { i: retries, n: MAX_RETRIES }))}</p>`, 'plain');
  retryTimer = setTimeout(() => connectTo(session.code, session.name, false), 2000);
}
function rejoin() {
  session = session || savedSession();
  if (!session) { show('join'); return; }
  retries = 0; kicked = false;
  $('pName').textContent = session.name;
  if (current !== 'player') show('player');
  pview(`<p class="big">${esc(t('connecting'))}</p>`, 'plain');
  connectTo(session.code, session.name, false);
}
function leaveAsPlayer() {
  clearTimeout(retryTimer);
  const p = myPeer; myPeer = null; myConn = null; session = null;
  if (p) { try { p.destroy(); } catch (e) {} }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && current === 'player' && session && !kicked && !(myConn && myConn.open)) {
    retries = 0; connectTo(session.code, session.name, false);
  }
});
function onHostMessage(msg, conn, fail, code) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.type) {
    case 'error': fail(msg.code === 'taken' ? t('nameTaken') : t('connProblem', { e: msg.code }), msg.code === 'taken'); break;
    case 'kicked':
      kicked = true; myConn = null; lsDel(SESSION_KEY);
      if (current !== 'player') show('player');
      pview(`<p class="big">${esc(t('kicked'))}</p>`, 'bad');
      try { myPeer && myPeer.destroy(); } catch (e) {}
      break;
    case 'welcome':
      myConn = conn; retries = 0;
      session = { code, name: msg.name, at: Date.now() };
      lsSet(SESSION_KEY, JSON.stringify(session));
      $('pName').textContent = msg.name; $('pScore').textContent = msg.score;
      $('status').textContent = ''; $('joinBtn').disabled = false;
      if (current !== 'player') show('player');
      break;
    case 'lobby': pview(`<p class="big">${esc(t('inLobby'))}</p><p class="muted">${esc(t('inLobbySub'))}</p>`, 'plain'); break;
    case 'between': pview(`<p class="big">${esc(t('getReady'))}</p>`, 'plain'); break;
    case 'score': $('pScore').textContent = msg.score; break;
    case 'question': renderPhoneQuestion(msg); break;
    case 'locked': {
      const o = msg.choice || {};
      pview(`<p class="muted">${esc(t('lockedOn'))}</p><p class="big" dir="auto" style="color:${okColor(o.color) ? o.color : 'inherit'}">${esc(o.name || '')}</p>
        <p class="muted">${esc(t('waitOthers'))}</p>`, 'plain');
      break;
    }
    case 'result': {
      $('pScore').textContent = msg.score;
      const s = msg.sender || {};
      const head = !msg.answered ? t('timeUp') : msg.correct ? t('correct') : t('wrong');
      pview(`<p class="big">${esc(head)}</p>${msg.points ? `<p class="pts">+${msg.points}</p>` : ''}
        <p>${esc(t('itWas', { n: s.name || '' }))}</p><p class="muted">${esc(t('rankOf', { r: msg.rank, n: msg.of }))}</p>`, msg.correct ? 'ok' : 'bad');
      break;
    }
    case 'final':
      $('pScore').textContent = msg.score;
      pview(`<p class="big">${msg.rank}</p><p>${esc(t('rankOf', { r: msg.rank, n: msg.of }))}</p><p class="pts">${msg.score}</p>`, msg.rank === 1 ? 'ok' : 'plain');
      break;
  }
}
function renderPhoneQuestion(m) {
  lastQ = m;
  const lines = Array.isArray(m.lines) ? m.lines.slice(0, 40) : [];
  const opts = Array.isArray(m.options) ? m.options : [];
  pview(`<div class="pq">
      <span class="lbl">${esc(t('qOf', { i: m.n, n: m.total }))}</span>
      ${chatHtml({ date: m.date, note: m.note, lines }, { small: true })}
      <span class="lbl">${esc(t('pickSender'))}</span>
      <div class="opts">${opts.map((o, i) => `<button class="opt" onclick="answer(${i})">
        <span class="av" style="background:${okColor(o.color) ? o.color : '#8696a0'}">${esc(initial(o.name))}</span><span class="nm" dir="auto">${esc(o.name)}</span></button>`).join('')}</div>
    </div>`);
  const body = document.querySelector('#pview .wa-body'); if (body) body.scrollTop = body.scrollHeight;
}
function answer(i) {
  if (!(myConn && myConn.open)) return;
  myConn.send({ type: 'answer', choice: i });
  document.querySelectorAll('#pview .opt').forEach(b => { b.disabled = true; });
}

function showRejoinBanner() {
  const s = savedSession();
  $('rejoinBox').hidden = !s;
  if (s) $('rejoinBtn').textContent = t('backToRoom', { c: s.code, n: s.name });
}
(function init() {
  try { history.replaceState({ screen: 'home' }, '', location.pathname + location.search); } catch (e) {}
  applyLang();
  showRejoinBanner();
  setTimeout(() => $('logo').classList.add('open'), 700);
  const drop = $('drop'), input = $('fileInput');
  input.addEventListener('change', () => { readFile(input.files[0]); input.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));
  const pre = new URLSearchParams(location.search).get('join');
  if (pre && /^\d{4}$/.test(pre)) { show('join'); $('codeInput').value = pre; $('nameInput').focus(); }
})();
